    {id:'gain', label:'reaction strength', min:.05, max:1, step:.05, value:.4, fmt:v => v.toFixed(2)}
  ],
  buttons: [{label:'Replay', fn:st => st.t = 0}],
  init(s){ const st = {delay:s.sensorDelayHours, gain:.4, target:s.target, t:0}; this.run(st); return st; },
  param(st, id, v){ if (id === 'sensorDelayHours') st.delay = v; else st.gain = v; this.run(st); st.t = 0; },
  run(st){
    const dt = .1, steps = 960, L = [600], U = [], Sd = [];
    for (let i = 0; i < steps; i++){
      const lag = Math.round(st.delay / dt), sensed = L[Math.max(0, i - lag)];
      const u = Math.max(0, Math.min(500, 100 + st.gain * (st.target - sensed)));
      U.push(u); Sd.push(sensed);
      L.push(L[i] + (u - .1 * L[i]) * dt);
    }
    st.L = L; st.U = U; st.S = Sd;
  },
  draw(st, r, dt){
    st.t += dt; const i = reduceMotion ? 959 : Math.min(959, Math.floor(st.t * 120));
    const [a, b] = split(r, .34);
    // tank schematic
    const tw = Math.min(a.w * .45, 110), th = Math.min(a.h * .62, 190), tx = a.x + (a.w - tw) / 2, ty = a.y + 40;
    const lvl = Math.min(1, st.L[i] / 1600);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5; ctx.strokeRect(tx, ty, tw, th);
    ctx.fillStyle = rgba(T.accent, .35); ctx.fillRect(tx + 1, ty + th * (1 - lvl), tw - 2, th * lvl - 1);
    const tgY = ty + th * (1 - st.target / 1600);
    ctx.setLineDash([4, 3]); ctx.strokeStyle = T.ink; ctx.beginPath(); ctx.moveTo(tx - 8, tgY); ctx.lineTo(tx + tw + 8, tgY); ctx.stroke(); ctx.setLineDash([]);
    txt('target', tx + tw + 10, tgY + 4, {size:10});
    const inW = 2 + st.U[i] / 40, outW = 2 + .1 * st.L[i] / 40;
    ctx.lineWidth = inW; ctx.strokeStyle = T.warn; ctx.beginPath(); ctx.moveTo(tx + tw/2, a.y + 6); ctx.lineTo(tx + tw/2, ty - 2); ctx.stroke();
    txt(`injection ${Math.round(st.U[i])}/h`, tx + tw/2 + 10, a.y + 20, {size:10, c:T.warn});
    ctx.lineWidth = outW; ctx.strokeStyle = T.cast.mira; ctx.beginPath(); ctx.moveTo(tx + tw, ty + th - 10); ctx.lineTo(tx + tw + 30, ty + th - 10); ctx.stroke();
    txt('plants absorb', tx + tw/2, ty + th + 16, {size:10, a:'center', c:T.cast.mira});
    txt(`reads ${Math.round(st.S[i])} ppm · actual ${Math.round(st.L[i])}`, a.x + a.w/2, ty + th + 32, {size:10, a:'center', c:T.ink});
    // chart
    const p = plot(b, {xmin:0, xmax:96, ymin:0, ymax:1800, xt:[0, 24, 48, 72, 96], yt:[0, 500, 1000, 1500], xl:'hours', yl:'CO₂ (ppm)', padL:44});
    polyline([[p.X(0), p.Y(st.target)], [p.X(96), p.Y(st.target)]], rgba(T.ink, .5), 1, [4, 3]);
    const pts = [], sp = [];
    for (let k = 0; k <= i; k += 2){ pts.push([p.X(k * .1), p.Y(st.L[k])]); sp.push([p.X(k * .1), p.Y(st.S[k])]); }
    polyline(sp, rgba(T.muted, .7), 1.2, [2, 3]);
    polyline(pts, T.accent, 2.2);
    legend([[T.accent, 'actual CO₂'], [T.muted, 'what the sensor shows'], [T.ink, 'target (dashed)', true]], p.R - 150, p.T + 12, 10);
  }
};

/* M11: model vs reality (Biosphere 2 pattern) */
SIMS['model-vs-reality'] = {
  title: 'The Earth-built oxygen model vs. what the dome measured',
  toggles: [{id:'microbes', label:'add soil microbes to model', on:false}, {id:'concrete', label:'add concrete absorbing CO₂', on:false}],
  init(){ return {microbes:false, concrete:false, t:0}; },
  param(st, id, v){ st[id] = v; },
  draw(st, r, dt){
    st.t += dt;
    const drop = t => 6.4 * Math.pow(t / 16, .9), real = t => 20.9 - drop(t);
    const share = (st.microbes ? .7 : 0) + (st.concrete ? .3 : 0), model = t => 20.9 - drop(t) * share;
    const [a, b] = split(r, .4);
    // flow diagram
    const cx = a.x + a.w / 2, cy = a.y + a.h * .45, bw = Math.min(120, a.w * .42), bh = 44;
    const box = (x, y, label, col, dashed) => { ctx.setLineDash(dashed ? [4, 3] : []); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.strokeRect(x - bw/2, y - bh/2, bw, bh); ctx.setLineDash([]); txt(label, x, y + 4, {a:'center', size:11, c:col}); };
    const arrow = (x1, y1, x2, y2, col, dashed) => { polyline([[x1, y1], [x2, y2]], col, 2, dashed ? [4, 3] : null); const an = Math.atan2(y2 - y1, x2 - x1); ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - 8*Math.cos(an - .4), y2 - 8*Math.sin(an - .4)); ctx.lineTo(x2 - 8*Math.cos(an + .4), y2 - 8*Math.sin(an + .4)); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); };
    box(cx, cy, 'O₂ in the air', T.ink);
    box(cx, a.y + 26, 'plants + lamps', T.cast.mira); arrow(cx, a.y + 48, cx, cy - bh/2 - 2, T.cast.mira);
    box(cx, a.y + a.h - 26, 'people', T.ink); arrow(cx, cy + bh/2, cx, a.y + a.h - 50, T.ink);
    const side = Math.min(a.w * .28, 90);
    txt('soil microbes', cx - side, cy + 52, {a:'center', size:10, c:st.microbes ? T.warn : T.muted});
    arrow(cx - bw/2 + 10, cy + bh/2, cx - side, cy + 40, st.microbes ? T.warn : T.muted, !st.microbes);
    txt('concrete', cx + side, cy + 52, {a:'center', size:10, c:st.concrete ? T.warn : T.muted});
    arrow(cx + bw/2 - 10, cy + bh/2, cx + side, cy + 40, st.concrete ? T.warn : T.muted, !st.concrete);
    txt('dashed = missing from the map', a.x, a.y + a.h - 2, {size:10});
    // chart
    const p = plot(b, {xmin:0, xmax:16, ymin:12, ymax:22, xt:[0, 4, 8, 12, 16], yt:[14, 16, 18, 20, 22], yf:v => v + '%', xl:'months sealed', yl:'oxygen in the air', padL:40});
    const up = reduceMotion ? 16 : Math.min(16, st.t * 5);
    const ptsR = [], ptsM = []; for (let t = 0; t <= up; t += .2){ ptsR.push([p.X(t), p.Y(real(t))]); ptsM.push([p.X(t), p.Y(model(t))]); }
    polyline(ptsM, T.accent, 2.2, [6, 4]); polyline(ptsR, T.warn, 2.4);
    legend([[T.warn, 'measured: 20.9% → ~14.5%'], [T.accent, share === 1 ? 'model: now matches' : 'model prediction']], p.L + 12, p.B - 30, 11);
    txt('split between microbes and concrete is illustrative', p.R, p.T + 10, {a:'right', size:9});
  }
};

/* M20: fixed power budget */
SIMS['budget-split'] = {
  title: '1,000 kW to share. Every watt moved is a watt taken.',
  controls: s => s.uses.map((u, i) => ({id:'u' + i, label:u, min:0, max:1000, step:10, value:[300, 250, 250, 200][i], fmt:v => v + ' kW'})),
  init(s){ return {kw:[300, 250, 250, 200], need:[300, 250, 250, 200], uses:s.uses, out:s.outputs}; },
  param(st, id, v){
    const i = +id.slice(1), rest = 1000 - v, others = st.kw.reduce((a, x, j) => j === i ? a : a + x, 0);
    st.kw = st.kw.map((x, j) => j === i ? v : others ? x / others * rest : rest / 3);
    syncControls(st.kw.map((x, j) => ['u' + j, Math.round(x)]));
  },
  draw(st, r){
    const cols = [T.cast.mira, T.cast.rook, T.accent, T.cast.dox];
    let x = r.x; const bh = 34;
    txt('POWER PLANT OUTPUT', r.x, r.y + 12, {size:10});
    st.kw.forEach((k, i) => { const w = k / 1000 * r.w; ctx.fillStyle = rgba(cols[i], .85); ctx.fillRect(x, r.y + 20, w, bh); if (w > 60) txt(Math.round(k) + ' kW', x + 6, r.y + 20 + bh/2 + 4, {size:11, c:T.bg}); x += w; });
    const top = r.y + 20 + bh + 30, rowH = Math.min(46, (r.h - (top - r.y)) / 4);
    st.kw.forEach((k, i) => {
      const y = top + i * rowH, ratio = k / st.need[i], w = Math.min(1.5, ratio) / 1.5 * (r.w * .6), x0 = r.x + r.w * .36;
      txt(`${st.uses[i]} → ${st.out[i]}`, r.x, y + 14, {size:12, c:T.ink});
      ctx.fillStyle = rgba(T.muted, .15); ctx.fillRect(x0, y + 2, r.w * .6, 16);
      ctx.fillStyle = ratio < .9 ? T.warn : cols[i]; ctx.fillRect(x0, y + 2, w, 16);
      const nx = x0 + (1 / 1.5) * r.w * .6; ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(nx, y - 2); ctx.lineTo(nx, y + 22); ctx.stroke();
      txt(ratio < .9 ? `short ${pct(1 - ratio)}` : ratio > 1.1 ? `surplus ${pct(ratio - 1)}` : 'meets need', x0, y + 32, {size:10, c:ratio < .9 ? T.warn : T.muted});
    });
    txt('black tick = what the colony needs', r.x + r.w, r.y + 12, {a:'right', size:10});
  }
};

/* ---------- screen overlay (holo) ---------- */
let SIM = null;   // {model, kind, st}
function simAvailable(m){ return !!SIMS[m.sim.kind]; }
function openSim(m){
  const k = SIMS[m.sim.kind]; if (!k) return;
  SIM = {model:m, kind:k, st:k.init(m.sim.settings)};
  buildControls(k, m.sim.settings, SIM.st);
  $('#simBtn').textContent = 'Close station screen';
}
function closeSim(){ SIM = null; $('#simControls').hidden = true; $('#simControls').innerHTML = ''; $('#simBtn').textContent = 'Open station screen'; }
function buildControls(k, settings, st){
  const box = $('#simControls'); box.innerHTML = '';
  for (const c of (k.controls ? k.controls(settings) : [])){
    const lab = document.createElement('label'); lab.className = 'ctl';
    lab.innerHTML = `<span>${c.label}</span><input type="range" id="sim-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"><output>${c.fmt(c.value)}</output>`;
    const inp = lab.querySelector('input'), out = lab.querySelector('output');
    inp.addEventListener('input', () => { const v = +inp.value; out.textContent = c.fmt(v); k.param(st, c.id, v); });
    inp._fmt = c.fmt; box.appendChild(lab);
  }
  for (const tg of k.toggles || []){
    st[tg.id] = tg.on;
    const lab = document.createElement('label'); lab.className = 'ctl';
    lab.innerHTML = `<input type="checkbox" id="sim-${tg.id}" ${tg.on ? 'checked' : ''}> <span>${tg.label}</span>`;
    lab.querySelector('input').addEventListener('change', e => k.param(st, tg.id, e.target.checked));
    box.appendChild(lab);
  }
  for (const b of k.buttons || []){
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = b.label;
    btn.addEventListener('click', () => b.fn(st)); box.appendChild(btn);
  }
}
function syncControls(pairs){
  for (const [id, v] of pairs){ const inp = document.getElementById('sim-' + id); if (!inp) continue; inp.value = v; inp.nextElementSibling.textContent = inp._fmt(v); }
}
function drawHolo(dt){
  ctx.fillStyle = rgba(T.bg[0] === '#' ? T.bg : '#000000', .55); ctx.fillRect(0, 0, VW, VH);
  const pad = Math.max(8, VW * .025), r = {x:pad, y:pad, w:VW - pad*2, h:VH - pad*2};
  rrect(r.x, r.y, r.w, r.h, 6); ctx.fillStyle = T.holo; ctx.fill(); ctx.strokeStyle = rgba(T.accent, .7); ctx.lineWidth = 1.5; ctx.stroke();
  txt('STATION SCREEN · ' + LOC[SIM.model.story.location].label, r.x + 14, r.y + 20, {size:10, c:T.accent});
  txt(SIM.kind.title, r.x + 14, r.y + 40, {size:Math.min(19, VW / 32), f:'disp', w:600, c:T.ink});
  const inner = {x:r.x + 14, y:r.y + 54, w:r.w - 28, h:r.h - 66};
  ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  SIM.kind.draw(SIM.st, inner, dt);
  ctx.restore();
}

/* ---------- lesson panel & story stepper ---------- */
let cur = null, beatIdx = 0, sentences = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
function splitSentences(t){ return t.match(/[^.!?]+[.!?]+['"’”]?\s*/g) || [t]; }
function speakerOf(s){
  const m = s.match(/\b(Ada|Mira|Dox|Rook)\b/); const y = /^\s*(You|'You|“You)\b/.test(s);
  if (y) return 'you'; return m ? m[1].toLowerCase() : null;
}
function openModel(id, fromTrail){
  const m = MODELS[id]; cur = m; beatIdx = 0; store.set('last', id);
  closeSim();
  sentences = splitSentences(m.story.beat);
  activeLoc = m.story.location; focus(activeLoc, 1.55);
  blight = Math.min(1, (m.story.trail - 1) / 16);
  // stage the cast
  cast.forEach(c => { c.stage = false; });
  const inScene = m.story.cast;
  inScene.forEach((cid, k) => { const c = who(cid); c.stage = true; sendTo(c, activeLoc, k, inScene.length); });
  cast.filter(c => !inScene.includes(c.id)).forEach(c => { c.stage = false; sendTo(c, HOME[c.id]); });
  renderPanel(m);
  renderTrail();
  playSentence();
  $('#where').textContent = `${LOC[activeLoc].label.toLowerCase()} · stop ${m.story.trail} of 20`;
  $('#simBtn').disabled = !simAvailable(m);
  $('#simBtn').title = simAvailable(m) ? '' : (m.sim.type === 'agents' ? 'Agent-world screen arrives in build step 5' : 'Diagram screen arrives in build step 3');
  if (fromTrail && innerWidth < 960) cv.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'start'});
}
function playSentence(){
  const s = sentences[beatIdx] || '';
  const sp = speakerOf(s);
  cast.forEach(c => { if (c.stage){ const k = cur.story.cast.indexOf(c.id); const [x, y] = spotIn(activeLoc, k, cur.story.cast.length); c.tx = x; c.ty = y; } });
  if (sp && who(sp)){
    const c = who(sp); c.pulse = 1.2; c.hop = .5;
    if (!c.stage){ c.stage = true; sendTo(c, activeLoc, 0, 1); }
    if (/!|scoff|burn|panic/i.test(s)) c.shake = .6;
  }
  document.querySelectorAll('.beat .s').forEach((el, i) => { el.classList.toggle('on', i === beatIdx); el.classList.toggle('done', i < beatIdx); });
  const n = $('#beatN'); if (n) n.textContent = `${beatIdx + 1} / ${sentences.length}`;
  const prev = $('#bPrev'), next = $('#bNext');
  if (prev) prev.disabled = beatIdx === 0;
  if (next) next.textContent = beatIdx >= sentences.length - 1 ? 'Replay' : 'Next';
}
function renderPanel(m){
  const acts = C.story.acts.find(a => a.act === m.story.act);
  const fx = $('#fx').checked;
  const rc = m.realCase;
  $('#panel').innerHTML = `
    <div class="eyebrow"><span>Act ${m.story.act} · ${esc(acts.title)}</span><span>Stop ${m.story.trail}/20</span><span>${esc(m.evidenceLabel)}</span></div>
    <h2>${esc(m.name)}</h2>
    <p class="small">${esc(m.originator)}${m.year && m.year !== '—' ? ' · ' + esc(m.year) : ''}</p>
    <p class="rule">${esc(m.rule)}</p>
    ${fx && m.formula ? `<div class="formula">${esc(m.formula)}</div>` : ''}
    <div class="sec"><h4>In the colony</h4>
      <p class="beat">${sentences.map(s => `<span class="s">${esc(s)}</span>`).join('')}</p>
      <div class="stepper"><button class="btn" id="bPrev" type="button">Back</button><button class="btn primary" id="bNext" type="button">Next</button><span class="n" id="beatN"></span></div>
    </div>
    <p class="plain">${esc(m.plain)}</p>
    <div class="sec"><h4>Same model, elsewhere in the colony</h4>
      <ul class="ex">${m.examples.map((e, i) => `<li><button type="button" data-ex="${i}" aria-pressed="false"><span class="loc">${esc(LOC[e.location].label.split(' ')[0])}</span><span>${esc(e.text)}</span></button></li>`).join('')}</ul>
    </div>
    <div class="archive"><div class="hd"><span>Archive transmission from Earth · ${esc(rc.year)}</span><b class="${rc.kind === 'success' ? 'ok' : ''}">${rc.kind}</b></div>
      <h5>${esc(rc.title)}</h5><p>${esc(rc.text)}</p><cite>${esc(rc.source)}</cite></div>
    <div class="sec"><h4>How this model misleads</h4><p class="misuse">${esc(m.misuse)}</p></div>
    <div class="sec"><h4>Connects to</h4><div class="rel">${m.related.map(r => `<button class="chip" type="button" data-go="${r}"><i>${MODELS[r].story.trail}</i>${esc(MODELS[r].name)}</button>`).join('')}</div></div>
    ${m.videos.length ? `<div class="sec"><h4>Watch</h4><ul class="src">${m.videos.map(v => `<li>${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>` : esc(v.title)} · ${esc(v.channel)}${v.url ? '' : ' (search on YouTube)'}</li>`).join('')}</ul></div>` : ''}
    <div class="sec"><h4>Sources</h4><ul class="src">${m.sources.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`;
  $('#bPrev').onclick = () => { if (beatIdx > 0){ beatIdx--; playSentence(); } };
  $('#bNext').onclick = () => { beatIdx = beatIdx >= sentences.length - 1 ? 0 : beatIdx + 1; playSentence(); };
  $('#panel').querySelectorAll('[data-go]').forEach(b => b.onclick = () => openModel(b.dataset.go, true));
  $('#panel').querySelectorAll('[data-ex]').forEach(b => b.onclick = () => showExample(m, +b.dataset.ex, b));
}
function showExample(m, i, btn){
  const e = m.examples[i];
  document.querySelectorAll('[data-ex]').forEach(x => x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'));
  closeSim();
  activeLoc = e.location; focus(e.location, 1.55);
  const pair = ['you', m.story.cast.find(c => c !== 'you') || 'ada'];
  cast.forEach(c => { c.stage = pair.includes(c.id); });
  pair.forEach((cid, k) => sendTo(who(cid), e.location, k, 2));
  who(pair[1]).pulse = 1.2;
  $('#where').textContent = `${LOC[e.location].label.toLowerCase()} · example ${i + 1} of 3`;
}
function renderTrail(){
  const nav = $('#trail');
  nav.innerHTML = C.story.acts.map(a => `<div class="act"><h3>Act ${a.act} · ${esc(a.title)}<span class="q"> — ${esc(a.question)}</span></h3>${
    a.models.map(id => { const m = MODELS[id]; return `<button class="chip" type="button" data-id="${id}" aria-current="${cur && cur.id === id}"><i>${m.story.trail}</i>${esc(m.name)}<span class="t">${m.sim.type}</span></button>`; }).join('')}</div>`).join('');
  nav.querySelectorAll('[data-id]').forEach(b => b.onclick = () => openModel(b.dataset.id, true));
}

/* ---------- input on canvas ---------- */
function locAt(ev){
  const b = cv.getBoundingClientRect(), [wx, wy] = toWorld(ev.clientX - b.left, ev.clientY - b.top);
  for (const [id, L] of Object.entries(LOC)) if (Math.abs(wx - L.x) < L.w/2 + 6 && Math.abs(wy - L.y) < L.h/2 + 6) return id;
  return null;
}
cv.addEventListener('pointermove', ev => { if (SIM) return; hoverLoc = locAt(ev); cv.style.cursor = hoverLoc && byLoc[hoverLoc] ? 'pointer' : 'default'; });
cv.addEventListener('click', ev => {
  if (SIM) return;
  const id = locAt(ev); if (!id || !byLoc[id]) return;
  const list = byLoc[id], i = cur && list.includes(cur.id) ? (list.indexOf(cur.id) + 1) % list.length : 0;
  openModel(list[i]);
});
$('#simBtn').onclick = () => { if (SIM) closeSim(); else if (cur) openSim(cur); };
$('#overview').onclick = () => { closeSim(); overview(); activeLoc = cur ? cur.story.location : null; };
$('#fx').checked = store.get('fx', false);
$('#fx').onchange = () => { store.set('fx', $('#fx').checked); if (cur){ const b = beatIdx; renderPanel(cur); beatIdx = b; playSentence(); } };
addEventListener('keydown', e => { if (e.key === 'Escape' && SIM) closeSim(); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const k = reduceMotion ? 1 : Math.min(1, dt * 3.5);
  cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; cam.z += (cam.tz - cam.z) * k;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stepCast(dt);
  drawColony(now / 1000);
  drawCast(now / 1000);
  if (SIM) drawHolo(dt);
  requestAnimationFrame(frame);
}
overview(); cam.x = cam.tx; cam.y = cam.ty; cam.z = cam.tz;
const start = store.get('last', TRAIL[0]);
openModel(MODELS[start] ? start : TRAIL[0]);
requestAnimationFrame(frame);
</script>
