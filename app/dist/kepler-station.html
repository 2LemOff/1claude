<title>Kepler Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#E8EDF1; --panel:#F7F9FB; --ink:#14202B; --muted:#586878; --line:#C7D1DA;
  --accent:#0B8A83; --accent-ink:#FFFFFF; --warn:#C8621E;
  --sky1:#D5E0E9; --sky2:#EEF3F6; --ground:#B7C3CD; --ground2:#A3B1BC; --module:#FFFFFF;
  --glass:rgba(11,138,131,0.07); --holo:rgba(247,249,251,0.95); --stars:0;
  --c-you:#FFFFFF; --c-ada:#0F9A8E; --c-mira:#4C9A2A; --c-dox:#2F6FD6; --c-rook:#D0453A;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-story:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0F15; --panel:#101821; --ink:#E2EAF0; --muted:#8696A6; --line:#233140;
    --accent:#3ED3C2; --accent-ink:#04211E; --warn:#F0914A;
    --sky1:#04070B; --sky2:#0C131B; --ground:#18232E; --ground2:#121B24; --module:#152029;
    --glass:rgba(62,211,194,0.06); --holo:rgba(11,17,24,0.95); --stars:0.85;
    --c-you:#F4F7FA; --c-ada:#3ED3C2; --c-mira:#86D05F; --c-dox:#76A7FF; --c-rook:#FF6E61;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F15; --panel:#101821; --ink:#E2EAF0; --muted:#8696A6; --line:#233140;
  --accent:#3ED3C2; --accent-ink:#04211E; --warn:#F0914A;
  --sky1:#04070B; --sky2:#0C131B; --ground:#18232E; --ground2:#121B24; --module:#152029;
  --glass:rgba(62,211,194,0.06); --holo:rgba(11,17,24,0.95); --stars:0.85;
  --c-you:#F4F7FA; --c-ada:#3ED3C2; --c-mira:#86D05F; --c-dox:#76A7FF; --c-rook:#FF6E61;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:14px 32px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}

/* header strip: the colony's status readout */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink);font-weight:500}
.status .bad b{color:var(--warn)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toggle input{accent-color:var(--accent)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:10px}
@media (max-width:960px){.stage{position:static}}
.canvasbox{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sky2)}
canvas#scene{display:block;width:100%;touch-action:manipulation}
.scenebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.simcontrols{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.simcontrols[hidden]{display:none!important}
.ctl{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ctl input[type=range]{width:130px;accent-color:var(--accent)}
.ctl output{color:var(--ink);min-width:4.5ch;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* trail */
.trail{display:flex;flex-direction:column;gap:8px}
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.act h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font-size:13px}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{border-color:var(--accent)}
.chip[aria-current="true"] i{background:var(--accent);color:var(--accent-ink)}
.chip .t{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase}

/* lesson panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.02;margin:0;text-wrap:balance}
.rule{font-size:16px;font-weight:500;margin:0}
.formula{font-family:var(--f-mono);font-size:13px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--bg);overflow-x:auto;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.beat{font-family:var(--f-story);font-size:17px;line-height:1.55;margin:0;max-width:62ch}
.beat .s{opacity:.38;transition:opacity .25s}
.beat .s.on{opacity:1}
.beat .s.done{opacity:.72}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plain{font-family:var(--f-story);font-style:italic;color:var(--muted);margin:0}
ul.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.ex button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;line-height:1.45}
ul.ex button:hover,ul.ex button[aria-pressed="true"]{border-color:var(--accent)}
ul.ex button:focus-visible{outline:2px solid var(--accent)}
ul.ex .loc{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--accent);padding-top:3px;width:9ch}
.archive{border:1px dashed var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.archive .hd{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.archive .hd b{color:var(--warn);font-weight:500}
.archive .hd b.ok{color:var(--accent)}
.archive h5{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.archive p{margin:0;font-family:var(--f-story);font-size:15px}
.archive cite{font-size:12px;color:var(--muted);font-style:normal}
.misuse{margin:0;font-size:14px;padding:10px 12px;border-left:2px solid var(--warn);background:var(--bg)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:13px;color:var(--muted);margin:0}
ul.src{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
ul.src a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.beat .s{transition:none}}
@media (max-width:960px){
  .act{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .act h3{width:auto;flex:0 0 auto}
  .act h3 .q{display:none}
  .chip{flex:0 0 auto;white-space:nowrap}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Kepler Station</h1><span>mental models · 20-model pilot</span></div>
    <div class="status" aria-label="Colony status">
      <span>crew <b>200</b></span>
      <span>O₂ reserve <b>6.0 t</b></span>
      <span class="bad">shortfall <b>≈50 kg/day</b></span>
      <span>supply ship <b>T−90 days</b></span>
      <label class="toggle"><input type="checkbox" id="fx"> formulas</label>
    </div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Colony scene">
      <div class="canvasbox"><canvas id="scene" aria-label="Kepler Station colony with five shape characters"></canvas></div>
      <div class="scenebar">
        <span id="where">Tap a building or a numbered stop below.</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="simBtn" type="button">Open station screen</button>
          <button class="btn" id="overview" type="button">Whole colony</button>
        </span>
      </div>
      <div class="simcontrols" id="simControls" hidden></div>
      <nav class="trail" id="trail" aria-label="Suggested trail"></nav>
    </section>

    <article class="panel" id="panel" aria-live="polite"></article>
  </div>
</div>

actually uses per day", "What other colonies do", "What the council prefers"], "answer": 1, "why": "Start from the physical quantity (about 0.84 kg of O2 per person per day). Tanks are just a unit someone chose."}, "mcq": [{"prompt": "First principles is weakest when…", "options": ["the starting facts are wrong or incomplete", "the problem is technical", "you have too much data", "the problem is new"], "answer": 0, "why": "It rebuilds from its inputs, so bad inputs produce confident nonsense."}], "whichModel": {"prompt": "A startup asks why batteries cost so much and prices out the raw metals, finding they cost a fraction of the pack price.", "options": ["First principles", "Fermi estimation", "Inversion", "Incentives"], "answer": 0, "why": "It rebuilds cost from what must be true (material costs), not from market prices."}}, "formula": null, "videos": [], "evidenceLabel": "🧭 method or rule of thumb"}, {"id": "M10", "name": "Second-order thinking", "aliases": ["And then what?", "Unintended consequences"], "originator": "Frédéric Bastiat ('the seen and the unseen', 1850); Robert K. Merton (1936)", "year": "1850 / 1936", "evidence": "method", "category": "Thinking moves", "rule": "Keep asking 'and then what?' First effects are obvious; second and third effects decide outcomes.", "plain": "Every fix causes something else. Look one or two steps further than everyone else.", "story": {"act": 3, "trail": 15, "location": "council", "cast": ["rook", "ada", "you"], "beat": "Rook proposes bringing in beetles that eat blight fungus. First-order: less blight. You ask 'and then what?' The beetles breed fast, have no predators in the dome, and eat seedlings once the fungus runs out. Ada adds the third order: dead seedlings mean less oxygen next season. The comms tower plays the archive: cane toads, 1935."}, "examples": [{"location": "market", "text": "A cap on water prices → people use more → the shortage gets worse → a black market appears."}, {"location": "clinic", "text": "Handing out painkillers freely → fewer complaints now → dependence later."}, {"location": "power", "text": "Cutting maintenance saves power this month and causes a costly breakdown next quarter."}], "sim": {"type": "diagram", "kind": "consequence-tree", "settings": {"root": "Release blight-eating beetles", "depth": 3, "revealOnClick": true}}, "realCase": {"kind": "failure", "title": "Cane toads in Australia", "year": 1935, "text": "About 100 cane toads were released in Queensland to eat beetles damaging sugar cane. They didn't control the beetles, and with no natural predators they spread across millions of square kilometres, poisoning native animals that tried to eat them.", "source": "Australian Government, Department of Climate Change, Energy, the Environment and Water: cane toad fact sheet"}, "misuse": "Endless 'and then what?' that paralyses action. Doing nothing has second-order effects too, so compare both chains.", "related": ["M14", "M9", "M16", "M18"], "sources": ["Frédéric Bastiat, 'What Is Seen and What Is Not Seen' (1850)", "Robert K. Merton, 'The Unanticipated Consequences of Purposive Social Action' (1936)"], "quiz": {"predict": {"prompt": "Beetles that eat blight fungus are released into a closed dome with no predators. Main risk?", "options": ["Nothing, because the blight is gone", "Beetles multiply and start eating crops once the fungus runs out", "Beetles die immediately", "Beetles improve air"], "answer": 1, "why": "With no predator and a disappearing food source, the new pest finds new food."}, "mcq": [{"prompt": "Bastiat's 'unseen' refers to…", "options": ["hidden taxes", "effects that happen later or elsewhere", "invisible light", "secret plans"], "answer": 1, "why": "Consequences not visible at the moment of decision."}], "whichModel": {"prompt": "A city adds lanes to cut traffic; within a few years the new lanes are just as jammed.", "options": ["Second-order thinking", "Sunk cost", "Map ≠ territory", "Bayes"], "answer": 0, "why": "Induced demand, the 'and then what' of more road."}}, "formula": null, "videos": [], "evidenceLabel": "🧭 method or rule of thumb"}, {"id": "M11", "name": "Map ≠ territory", "aliases": ["All models are wrong", "Model limits"], "originator": "Alfred Korzybski; George Box", "year": "1931 / 1976", "evidence": "proven", "category": "Thinking moves", "rule": "Every model leaves things out, so know where yours breaks.", "plain": "A map is useful because it simplifies. Know which simplifications matter here.", "story": {"act": 2, "trail": 10, "location": "comms", "cast": ["ada", "you"], "beat": "The colony's oxygen simulator, built on Earth, says the greenhouse should be fine. Ada pulls it apart: it models plants and lamps but not soil microbes, which also breathe oxygen. The map left out a living part of the territory. The comms tower plays an archive transmission: Biosphere 2."}, "examples": [{"location": "power", "text": "The solar model assumes clear skies. Dust storms aren't on that map, so the storage plan must allow for them."}, {"location": "mine", "text": "The rock model treats the crust as uniform. The drill hits a hidden void the map never showed."}, {"location": "market", "text": "The price model assumes rational traders. During the panic, nobody behaves like the map."}], "sim": {"type": "flow", "kind": "model-vs-reality", "settings": {"model": ["plants", "lamps"], "reality": ["plants", "lamps", "soil microbes", "concrete absorbing CO2"], "toggleHiddenFactors": true}}, "realCase": {"kind": "failure", "title": "Biosphere 2's vanishing oxygen", "year": 1991, "text": "Eight people sealed themselves inside a 1.27-hectare artificial world in Arizona. Over 16 months, oxygen fell from 20.9% to about 14.5%, and fresh oxygen had to be pumped in. The designers' model had missed two things: rich soil full of microbes consuming oxygen, and fresh concrete absorbing the CO2 that should have been recycled back into oxygen.", "source": "Severinghaus et al., 'Oxygen loss in Biosphere 2', Eos (1994)"}, "misuse": "Rejecting all models because none are perfect. The question isn't 'is it true?' but 'is it useful here, and where does it break?'", "related": ["M12", "M1", "M17"], "sources": ["Alfred Korzybski, Science and Sanity (1933)", "George Box, 'Science and Statistics', JASA (1976)"], "quiz": {"predict": {"prompt": "The Earth-built simulator says oxygen should be fine, but it isn't. Most likely reason?", "options": ["The sensors lie", "The model leaves out something that matters here", "Random noise", "Sabotage"], "answer": 1, "why": "When a model and reality disagree, look for what the map omits."}, "mcq": [{"prompt": "What drained Biosphere 2's oxygen?", "options": ["A hull leak", "Soil microbes plus concrete absorbing CO2", "Too many people", "Plant disease"], "answer": 1, "why": "Both were missing from the design model."}], "whichModel": {"prompt": "Newton's laws predict a satellite clock perfectly, except that GPS needs relativity corrections or errors of about 10 km build up each day.", "options": ["Map ≠ territory", "Chaos", "First principles", "Bayes"], "answer": 0, "why": "A great model applied past its limits."}}, "formula": null, "videos": [], "evidenceLabel": "✅ proven (math/logic)"}, {"id": "M12", "name": "Hard-to-vary explanations + Occam's razor", "aliases": ["Good explanations", "Parsimony"], "originator": "David Deutsch; William of Ockham", "year": "2011 / c. 1320s", "evidence": "method", "category": "Thinking moves", "rule": "Prefer explanations where every part does work and fewer assumptions are needed. An explanation that fits any outcome explains nothing.", "plain": "A good explanation would break if you changed its details. A vague one bends to fit anything, so it predicts nothing.", "story": {"act": 2, "trail": 8, "location": "habitat", "cast": ["mira", "you", "ada"], "beat": "Two explanations circulate in the Habitat Ring. One: 'the dome is unlucky; the soil is tired.' Two: 'the new LED batch has drifted toward blue, which stresses this crop and lets blight in.' The first fits any outcome. The second names a batch, a wavelength and a crop, and predicts that the old-batch racks are fine. They are."}, "examples": [{"location": "power", "text": "'Gremlins' explain every outage. A 'thermal fuse rated too low' explains exactly the afternoon outages, and nothing else."}, {"location": "clinic", "text": "Two diagnoses fit the symptoms. One needs a single cause; the other needs three rare coincidences. Test the single cause first."}, {"location": "council", "text": "A councillor blames 'bad morale' for everything. When an explanation can't be wrong, it can't guide action either."}], "sim": {"type": "diagram", "kind": "explanation-flex", "settings": {"explanations": ["The dome is unlucky", "Blue-shifted LED batch stresses crop"], "dragOutcome": true}}, "realCase": {"kind": "failure", "title": "Epicycles", "year": "2nd century to 1609", "text": "Ptolemy's Earth-centred astronomy could fit any new planetary observation by adding another circle on a circle. It was endlessly adjustable, so it explained little. Kepler's ellipses (1609) were hard to vary: change one parameter and the predictions visibly break.", "source": "Thomas Kuhn, The Copernican Revolution (1957)"}, "misuse": "Using Occam's razor to reject a true but messy cause. Reality is sometimes complicated, and simplest-first is a search order, not a verdict.", "related": ["M3", "M11", "M2"], "sources": ["David Deutsch, The Beginning of Infinity (2011), ch. 1", "Elliott Sober, Ockham's Razors (2015)"], "quiz": {"predict": {"prompt": "Which explanation is better? A: 'The dome is unlucky.' B: 'LED batch 7 drifted blue and stresses lettuce.'", "options": ["A, because it's simpler", "B, because it makes specific predictions that could fail", "Both equal", "Neither"], "answer": 1, "why": "Simple in words isn't the same as good. B is hard to vary and testable."}, "mcq": [{"prompt": "An explanation that fits every possible outcome is…", "options": ["very strong", "useless for prediction", "proven", "Bayesian"], "answer": 1, "why": "If nothing could contradict it, it tells you nothing."}], "whichModel": {"prompt": "A horoscope's 'you may face challenges this week' is true whatever happens.", "options": ["Hard-to-vary explanations", "Regression to the mean", "Incentives", "First principles"], "answer": 0, "why": "It's easy to vary, so it's not a real explanation."}}, "formula": null, "videos": [], "evidenceLabel": "🧭 method or rule of thumb"}, {"id": "M13", "name": "Fermi estimation", "aliases": ["Order-of-magnitude estimate", "Back-of-the-envelope"], "originator": "Enrico Fermi", "year": "1940s", "evidence": "method", "category": "Thinking moves", "rule": "Build a rough number from quantities you already know. The right order of magnitude often settles whether an idea is even possible.", "plain": "Split the unknown into a chain of things you can guess, multiply them together, and keep only the first digit and the number of zeros.", "formula": "200 people × 0.84 kg O₂/day ≈ 170 kg O₂/day", "story": {"act": 1, "trail": 2, "location": "lifesupport", "cast": ["you", "ada"], "beat": "Ada asks 'How long do we have?' Nobody has an exact model. You estimate: 200 people × about 0.84 kg a day ≈ 170 kg a day. The tanks hold about 6 tonnes, and the greenhouse still covers about 70% of demand. That leaves a shortfall of about 50 kg a day, so roughly 120 days. The ship is 90 days out. It's tight, but you can survive it, and that one number stops the panic."}, "examples": [{"location": "greenhouse", "text": "How many crop racks would full oxygen independence take? Rack area × yield per m² gives an answer within a factor of 3, which is enough to know if it fits in the dome."}, {"location": "mine", "text": "Is mining ice for oxygen worth it? Energy per kg of electrolysis × kg needed, compared with the power plant's output, shows it's possible but would use half the plant."}, {"location": "habitat", "text": "How many conversations spread a rumour through 200 people in a day? A few contacts each, over a few hours, is enough for everyone by evening."}], "sim": {"type": "diagram", "kind": "estimate-chain", "settings": {"factors": [["colonists", 200], ["kg O2 per person per day", 0.84]], "showLogScale": true}}, "realCase": {"kind": "success", "title": "Fermi's paper strips at Trinity", "year": 1945, "text": "At the first atomic test, Fermi dropped scraps of paper as the blast wave passed and paced out how far they moved. His estimate of about 10 kilotons was the right order of magnitude of the measured yield, roughly 20 kilotons, and he had it within seconds.", "source": "Los Alamos National Laboratory historical records; Fermi's handwritten Trinity report"}, "misuse": "Treating a rough estimate as precise, or stacking so many guesses that the errors compound. Say 'about 100', not '112.4'.", "related": ["M1", "M5", "M15"], "sources": ["Lawrence Weinstein & John Adam, Guesstimation (2008)", "NASA Baseline Values and Assumptions Document (crew O2 consumption ≈ 0.84 kg/day)"], "quiz": {"predict": {"prompt": "Oxygen shortfall is 50 kg/day and storage is 6,000 kg. Roughly how many days until empty?", "options": ["about 12", "about 120", "about 1,200", "impossible to say"], "answer": 1, "why": "6,000 ÷ 50 = 120. The order of magnitude is what matters."}, "mcq": [{"prompt": "A Fermi estimate is 'good' if it is…", "options": ["exact", "within about a factor of 10 or better, and it changes the decision", "sourced from an expert", "under 5% error"], "answer": 1, "why": "Its job is to decide whether something is possible, not to replace measurement."}], "whichModel": {"prompt": "Before building a product, a founder multiplies possible customers × share who'd pay × price and finds the market is tiny.", "options": ["Fermi estimation", "Bayesian updating", "Expected value", "Bottlenecks"], "answer": 0, "why": "A chain of rough known quantities, used to test whether the idea is viable."}}, "videos": [], "evidenceLabel": "🧭 method or rule of thumb"}, {"id": "M14", "name": "Feedback loops", "aliases": ["Reinforcing and balancing loops", "Systems thinking"], "originator": "Norbert Wiener (cybernetics); Jay Forrester; Donella Meadows", "year": "1948 / 1961 / 2008", "evidence": "strong", "category": "Recurring patterns", "rule": "Reinforcing loops snowball, balancing loops stabilise, and delays cause overshoot and oscillation.", "plain": "Outputs feed back into inputs. Find the loops and you understand why the system behaves the way it does.", "formula": "Δstock = inflow − outflow (per time step)", "story": {"act": 3, "trail": 13, "location": "lifesupport", "cast": ["ada", "you"], "beat": "Ada wires CO2 injection to boost plant growth. The sensor reads with a 6-hour delay. CO2 is low, so she injects; the reading doesn't change yet, so she injects more. Six hours later CO2 overshoots and the plants suffer. She cuts it, and it undershoots. The delay turned a balancing loop into a wobble. Meanwhile sick plants make less oxygen, stressing the healthy ones, which then get sick: a reinforcing loop."}, "examples": [{"location": "market", "text": "Rumour of a water shortage → hoarding → real shortage → more hoarding. A reinforcing loop, like a bank run."}, {"location": "habitat", "text": "Thermostats form a balancing loop: too cold → heat on → warm → heat off."}, {"location": "docks", "text": "Order delays make supply managers over-order, then under-order: the bullwhip effect."}], "sim": {"type": "flow", "kind": "stock-and-flow", "settings": {"stock": "CO2 level", "target": 1000, "sensorDelayHours": 6, "sliders": ["sensorDelayHours", "gain"]}}, "realCase": {"kind": "failure", "title": "The Beer Game", "year": "1960s onward", "text": "In MIT's supply-chain simulation, players manage one link of a beer supply chain with delayed orders. Almost every team produces wild swings of shortage and glut from one small change in customer demand. They blame each other, but the cause is the delay in the loop.", "source": "John Sterman, 'Modeling Managerial Behavior', Management Science 35 (1989)"}, "misuse": "Drawing loops for everything until the diagram explains nothing. A loop map is a hypothesis; check it against data.", "related": ["M15", "M6", "M10", "M5"], "sources": ["Donella Meadows, Thinking in Systems (2008)", "Peter Senge, The Fifth Discipline (1990)"], "videos": [{"title": "LOOPY: a tool for thinking in systems (interactive)", "channel": "Nicky Case", "url": "https://ncase.me/loopy/", "verified": false}], "animation": {"planned": true, "tool": "Manim", "note": "One of the 2 code-made animations: a delayed balancing loop overshooting and oscillating, compared with the same loop without delay."}, "quiz": {"predict": {"prompt": "The CO2 sensor has a 6-hour delay. Ada adjusts injection every hour based on it. What happens?", "options": ["CO2 stays perfectly steady", "CO2 overshoots and swings back and forth", "Nothing changes", "CO2 falls to zero"], "answer": 1, "why": "Acting on delayed information in a balancing loop causes oscillation."}, "mcq": [{"prompt": "A bank run is a…", "options": ["balancing loop", "reinforcing loop", "random walk", "equilibrium"], "answer": 1, "why": "Each withdrawal makes the next more likely."}], "whichModel": {"prompt": "A shower goes from freezing to scalding because the water takes a few seconds to reach you.", "options": ["Feedback loops", "Chaos", "Incentives", "Trade-offs"], "answer": 0, "why": "A balancing loop with a delay."}}, "evidenceLabel": "🔬 strong evidence"}, {"id": "M15", "name": "Exponentials and S-curves", "aliases": ["Exponential growth", "Rule of 70", "Logistic growth"], "originator": "Thomas Malthus (1798); Pierre-François Verhulst (logistic curve, 1838)", "year": "1798 / 1838", "evidence": "proven", "category": "Recurring patterns", "rule": "Anything growing in proportion to itself doubles on a schedule: years to double ≈ 70 ÷ % growth rate. Real exponentials eventually bend into S-curves when they hit limits.", "plain": "Doubling looks like nothing, then everything. Intuition expects straight lines, so it's always late.", "formula": "doubling time ≈ 70 / r%   ·   dN/dt = rN(1 − N/K)", "story": {"act": 3, "trail": 12, "location": "greenhouse", "cast": ["you", "mira", "ada"], "beat": "Blight is on 4 racks. 'Only 1%,' says Rook. You check the log: it doubles every 3 days. 4 → 8 → 16 → 32 → 64 → 128 → 256 → the whole dome in about 3 weeks. Waiting a week for more data means acting with four times as many sick racks. The curve only bends into an S when it runs out of racks, which is too late."}, "examples": [{"location": "market", "text": "A loan at 7% a year doubles in about 10 years (70 ÷ 7)."}, {"location": "habitat", "text": "A new app spreads through the Ring fast, then levels off once everyone has it. A classic S-curve."}, {"location": "power", "text": "Power demand growing 5% a year doubles in 14 years. Plan the reactor expansion now, not when the lights flicker."}], "sim": {"type": "flow", "kind": "growth-curve", "settings": {"initial": 4, "doublingDays": 3, "capacity": 400, "toggle": ["linear intuition", "exponential", "logistic"]}}, "realCase": {"kind": "failure", "title": "Early COVID-19 delays", "year": 2020, "text": "In early 2020, confirmed cases in many countries doubled every few days. Governments that waited for case counts to 'look serious' acted when the numbers were already many times larger, because every week's delay multiplied the problem.", "source": "Our World in Data, COVID-19 case doubling times (2020)"}, "misuse": "Extrapolating an exponential forever. Every real exponential hits a limit and bends into an S-curve, so predictions of infinite growth are as wrong as linear ones.", "related": ["M14", "M6", "M13"], "sources": ["Albert Bartlett, 'Arithmetic, Population and Energy' lecture (1969 onward)", "Donella Meadows et al., The Limits to Growth (1972)"], "videos": [{"title": "Exponential growth and epidemics", "channel": "3Blue1Brown", "url": null, "verified": false}], "animation": {"planned": true, "tool": "Manim", "note": "One of the 2 code-made animations: a doubling grid of racks bending into an S-curve."}, "quiz": {"predict": {"prompt": "Blight on 4 of 400 racks, doubling every 3 days. Roughly when is the whole dome infected?", "options": ["about 3 months", "about 3 weeks", "about 1 year", "never"], "answer": 1, "why": "4 → 400 is about 7 doublings × 3 days ≈ 20 days."}, "mcq": [{"prompt": "Growth of 10% a year doubles in about…", "options": ["3 years", "7 years", "10 years", "70 years"], "answer": 1, "why": "70 ÷ 10 = 7."}], "whichModel": {"prompt": "A lily pad patch doubles daily and covers the pond on day 30. On day 29 it covers half and nobody worries.", "options": ["Exponentials and S-curves", "Feedback loops", "Fat tails", "Chaos"], "answer": 0, "why": "The classic late-intuition trap."}}, "evidenceLabel": "✅ proven (math/logic)"}, {"id": "M16", "name": "Incentives", "aliases": ["Principal–agent problem", "Perverse incentives", "Cobra effect"], "originator": "Adam Smith (1776); modern principal–agent theory (1970s)", "year": "1776 / 1970s", "evidence": "strong", "category": "Recurring patterns", "rule": "People and institutions follow what's rewarded, not what's intended. Before assuming malice, check the incentives and what information people had.", "plain": "Show me how someone is paid, and I'll show you how they'll behave.", "story": {"act": 4, "trail": 18, "location": "market", "cast": ["rook", "mira", "you"], "beat": "To speed recovery, the council pays a bonus per kilogram of harvested greens. Harvests jump, and oxygen drops. The crew is picking plants young and heavy with water, before they've produced much oxygen. Nobody cheated; they did exactly what was paid for. You rewrite the bonus: pay per litre of oxygen measured at the dome's outlet."}, "examples": [{"location": "clinic", "text": "Dox is paid per visit, so appointments get shorter and more frequent. Nobody planned that."}, {"location": "mine", "text": "Miners paid per tonne ignore safety checks. Adding a bonus for injury-free months changes behaviour within weeks."}, {"location": "council", "text": "Councillors elected every 6 months favour quick fixes over the 10-year oxygen plan."}], "sim": {"type": "agents", "kind": "reward-rule", "settings": {"agents": 30, "rewardOptions": ["kg harvested", "O2 measured at outlet"], "showIntendedVsActual": true}}, "realCase": {"kind": "failure", "title": "The Hanoi rat bounty", "year": 1902, "text": "French colonial authorities in Hanoi paid a bounty for each rat tail to fight plague. Officials soon saw tailless rats running the streets: people cut off tails and let the rats go on breeding. Some even farmed rats for the bounty.", "source": "Michael G. Vann, 'Of Rats, Rice, and Race', French Colonial History 4 (2003)"}, "misuse": "Assuming incentives explain everything and ignoring values, habits and identity. People also act from duty and pride, and poorly designed pay can crowd those out.", "related": ["M19", "M10", "M20"], "sources": ["Steven Levitt & Stephen Dubner, Freakonomics (2005)", "Charlie Munger, 'The Psychology of Human Misjudgment' (1995)"], "quiz": {"predict": {"prompt": "The council pays per kg of greens harvested. What happens to oxygen output?", "options": ["It rises", "It may fall as the crew harvests young, heavy plants early", "No change", "It doubles"], "answer": 1, "why": "People optimise the paid metric, not the goal."}, "mcq": [{"prompt": "The Hanoi rat bounty backfired because…", "options": ["rats were immune", "tails were rewarded, not dead rats, so people bred rats", "no one participated", "the price was too low"], "answer": 1, "why": "The reward measured tails, not fewer rats."}], "whichModel": {"prompt": "A bank sets high sales targets; employees open millions of fake accounts.", "options": ["Incentives", "Fat tails", "Chaos", "Regression to the mean"], "answer": 0, "why": "They followed the reward, not the intention."}}, "formula": null, "videos": [], "evidenceLabel": "🔬 strong evidence"}, {"id": "M17", "name": "Normal vs. fat-tailed distributions", "aliases": ["Power laws", "Black swans", "Pareto"], "originator": "Vilfredo Pareto (1896); Benoît Mandelbrot (1963); Nassim Taleb (2007)", "year": "1896 / 1963", "evidence": "strong", "category": "Recurring patterns", "rule": "Heights cluster near an average. Wealth, city sizes, earthquakes and book sales follow power laws, where averages mislead and rare extremes dominate.", "plain": "In some worlds the biggest event is only a bit bigger than the average. In others, one event can be bigger than all the rest combined.", "formula": "Normal: P(x) ∝ e^(−x²/2σ²)   ·   Power law: P(X > x) ∝ x^(−α)", "story": {"act": 3, "trail": 17, "location": "lifesupport", "cast": ["ada", "you", "rook"], "beat": "The hull has taken 500 micrometeoroid hits in 10 years, all tiny, and the average hit is harmless. Rook wants to cut shielding. You plot the hit sizes: a power law. The rare big impact isn't a bit worse than average; it could be thousands of times worse. The shield budget stays."}, "examples": [{"location": "market", "text": "Two traders out of 200 hold most of the colony's credits. The 'average wealth' describes nobody."}, {"location": "habitat", "text": "Colonists' heights are normal: nobody is 5 metres tall. Their follower counts on the colony net are fat-tailed."}, {"location": "power", "text": "Most solar flares are harmless; the rare giant one can fry every circuit, so plan for the tail."}], "sim": {"type": "dots", "kind": "distribution-compare", "settings": {"left": {"dist": "normal", "label": "heights"}, "right": {"dist": "pareto", "alpha": 1.2, "label": "impact sizes"}, "samples": 1000, "showRunningMean": true}}, "realCase": {"kind": "failure", "title": "Long-Term Capital Management", "year": 1998, "text": "A hedge fund run by star traders and two Nobel-winning economists used models that treated extreme market moves as near-impossible. Heavily borrowed, it lost about $4.6 billion in a few months after Russia's debt default, and the New York Fed organised a bank-funded rescue to prevent wider damage.", "source": "Roger Lowenstein, When Genius Failed (2000)"}, "misuse": "Treating '80/20' as a law of nature, or calling everything a 'black swan' after the fact to excuse bad planning.", "related": ["M11", "M9", "M15"], "sources": ["Nassim Taleb, The Black Swan (2007)", "Mark Newman, 'Power laws, Pareto distributions and Zipf's law', Contemporary Physics (2005)"], "quiz": {"predict": {"prompt": "500 small hull hits so far. Impact sizes follow a power law. The worst future hit is likely…", "options": ["about the average", "about twice the average", "possibly far larger than anything seen so far", "smaller than past hits"], "answer": 2, "why": "Fat tails mean the past maximum isn't a ceiling."}, "mcq": [{"prompt": "Which is fat-tailed?", "options": ["adult height", "exam scores", "city populations", "body temperature"], "answer": 2, "why": "City sizes follow a power law."}], "whichModel": {"prompt": "A publisher's one bestseller outsells its other 500 books combined.", "options": ["Fat tails", "Regression", "Incentives", "Bayes"], "answer": 0, "why": "Extreme winners dominate totals."}}, "videos": [], "evidenceLabel": "🔬 strong evidence"}, {"id": "M18", "name": "Evolution by selection", "aliases": ["Natural selection", "Variation–selection–inheritance"], "originator": "Charles Darwin & Alfred Russel Wallace", "year": "1858–1859", "evidence": "strong", "category": "Recurring patterns", "rule": "Anything with variation, selection and inheritance adapts without a designer.", "plain": "Wherever copies vary and some copies survive better, the survivors' traits spread. It happens to genes, ideas, companies and algorithms.", "formula": "Response = h² × Selection differential (breeder's equation)", "story": {"act": 3, "trail": 14, "location": "greenhouse", "cast": ["dox", "mira", "you"], "beat": "The fungicide works: blight falls 95%. A month later it's back, and the fungicide barely touches it. Dox explains: the 5% that survived were the resistant ones, and they seeded the next generation. The colony selected for its own enemy. The new plan rotates two fungicides and never sprays at half strength."}, "examples": [{"location": "market", "text": "Stall designs that attract buyers get copied; the others vanish. The market 'evolves' without anyone designing it."}, {"location": "habitat", "text": "Jokes and rumours mutate as they're retold, and the most repeatable versions survive."}, {"location": "power", "text": "Ada's scheduling algorithm 'breeds' candidate schedules, keeps the best and mixes them. A genetic algorithm."}], "sim": {"type": "agents", "kind": "selection", "settings": {"population": 200, "traits": ["resistance"], "selectionPressure": 0.95, "generations": 20, "sliders": ["selectionPressure", "mutationRate"]}}, "realCase": {"kind": "failure", "title": "Antibiotic resistance", "year": 1945, "text": "In his 1945 Nobel lecture, Alexander Fleming warned that underdosing penicillin would breed resistant bacteria. Decades of overuse in medicine and farming did exactly that. Drug-resistant infections are now a leading global health threat.", "source": "Alexander Fleming, Nobel Lecture (1945); WHO fact sheet on antimicrobial resistance"}, "misuse": "Treating evolution as 'progress' or as a moral rule ('survival of the fittest' as justification). It only means 'fits the current environment', which says nothing about what's good.", "related": ["M6", "M10", "M19"], "sources": ["Charles Darwin, On the Origin of Species (1859)", "Richard Dawkins, The Selfish Gene (1976)", "Daniel Dennett, Darwin's Dangerous Idea (1995)"], "quiz": {"predict": {"prompt": "Fungicide kills 95% of blight. What happens after a month of daily use?", "options": ["Blight disappears", "Blight returns, mostly resistant", "Blight stays at 5% forever", "Plants become immune"], "answer": 1, "why": "The survivors were the resistant ones; they reproduce."}, "mcq": [{"prompt": "Which three conditions are needed for evolution?", "options": ["Variation, selection, inheritance", "Design, purpose, time", "Size, speed, strength", "Mutation only"], "answer": 0, "why": "Without any one of these, no adaptation."}], "whichModel": {"prompt": "Spam filters block most spam; months later spam has changed to slip past them.", "options": ["Evolution by selection", "Incentives", "Signal vs. noise", "Fat tails"], "answer": 0, "why": "Filters are selection pressure on spam variants."}}, "videos": [], "evidenceLabel": "🔬 strong evidence"}, {"id": "M19", "name": "Game theory", "aliases": ["Prisoner's dilemma", "Tragedy of the commons", "Tit for tat"], "originator": "John von Neumann & Oskar Morgenstern (1944); John Nash (1950); Robert Axelrod (1984)", "year": "1944–1984", "evidence": "proven", "category": "Recurring patterns", "rule": "Your best move depends on what others do. Repeated play plus reputation make cooperation possible.", "plain": "When everyone grabs what's best for themselves, everyone can end up worse off, unless the game repeats and people remember.", "formula": "Prisoner's dilemma payoffs: T > R > P > S (temptation > reward > punishment > sucker)", "story": {"act": 4, "trail": 19, "location": "council", "cast": ["rook", "mira", "you"], "beat": "Water is short. The mine needs it for drilling; the greenhouse needs it for plants. Each crew does better by quietly drawing extra, but if both do, the reservoir fails and both lose. It's a tragedy of the commons. You set up a repeated game: daily public meter readings, and each crew mirrors what the other did yesterday (tit for tat). Within a week, both draw their fair share."}, "examples": [{"location": "market", "text": "Two stalls cut prices to beat each other until neither makes a profit: a price war."}, {"location": "habitat", "text": "Everyone would rather someone else cleaned the shared air filters. Reputation, via a visible rota, solves it."}, {"location": "docks", "text": "Two colonies negotiating supply-ship space do better with long-term deals than one-off grabs."}], "sim": {"type": "agents", "kind": "iterated-dilemma", "settings": {"strategies": ["always cooperate", "always defect", "tit for tat", "grudger", "random"], "rounds": 10, "noise": 0.05}}, "realCase": {"kind": "failure", "title": "Collapse of the Grand Banks cod", "year": 1992, "text": "For centuries, the waters off Newfoundland held one of the richest fisheries on Earth. Each fleet had an incentive to catch more before others did. By 1992 the stock had collapsed, Canada imposed a moratorium, and about 30,000 jobs were lost. The cod have still not fully recovered.", "source": "Fisheries and Oceans Canada; Myers, Hutchings & Barrowman, Ecological Applications (1997)"}, "misuse": "Assuming everyone is a cold calculator. Real people cooperate more than simple models predict, and treating them as purely selfish can make them act that way.", "related": ["M16", "M20", "M18"], "sources": ["Robert Axelrod, The Evolution of Cooperation (1984)", "Garrett Hardin, 'The Tragedy of the Commons', Science 162 (1968)", "Elinor Ostrom, Governing the Commons (1990)"], "videos": [{"title": "The Evolution of Trust (interactive)", "channel": "Nicky Case", "url": "https://ncase.me/trust/", "verified": false}, {"title": "What Game Theory Reveals About Life, The Universe, and Everything", "channel": "Veritasium", "url": null, "verified": false}], "quiz": {"predict": {"prompt": "Two crews share a reservoir and meet daily. Which strategy tends to do best over many rounds?", "options": ["Always take extra", "Always give way", "Cooperate first, then copy what the other did last time", "Random"], "answer": 2, "why": "Tit for tat won Axelrod's tournaments: nice, retaliatory, forgiving, clear."}, "mcq": [{"prompt": "Elinor Ostrom showed commons can be managed well when…", "options": ["a government owns them", "users set and enforce their own rules with monitoring", "they're privatised", "never"], "answer": 1, "why": "She won the 2009 Nobel for this."}], "whichModel": {"prompt": "Two countries keep building weapons because each fears the other will, and both end up poorer and no safer.", "options": ["Game theory", "Feedback loops", "Sunk cost", "Map ≠ territory"], "answer": 0, "why": "An arms race is a prisoner's dilemma."}}, "evidenceLabel": "✅ proven (math/logic)"}, {"id": "M2", "name": "Bayesian updating", "aliases": ["Bayes' theorem", "Base rates"], "originator": "Thomas Bayes; Pierre-Simon Laplace", "year": "1763 / 1812", "evidence": "proven", "category": "Thinking moves", "rule": "Start from the base rate (how often this is usually true), then update by how much likelier the evidence is if you're right than if you're wrong.", "plain": "A positive test doesn't mean 'probably yes'. It depends on how rare the thing was to begin with.", "formula": "P(H|E) = P(E|H)·P(H) / P(E)", "story": {"act": 2, "trail": 5, "location": "clinic", "cast": ["dox", "you", "mira"], "beat": "Dox's leaf-blight test catches 90% of infected plants but flags 5% of healthy ones. About 2% of plants are infected. A rack tests positive and Mira wants to burn it. You draw 1,000 plants as dots: 20 infected (18 flagged) and 980 healthy (49 falsely flagged). Only 18 of the 67 flagged plants, about 27%, are really sick. The rack gets a second test instead of the fire."}, "examples": [{"location": "comms", "text": "An alarm from Earth says '99% accurate storm warning'. Storms are rare, so most alarms are false. You check the base rate before evacuating the docks."}, {"location": "habitat", "text": "A rumour says Rook is hoarding water. How often are such rumours true here? Rarely, so one sighting shifts your belief only a little."}, {"location": "mine", "text": "A drill sensor flags ice. Ice is common in this region, so the same beep is more trustworthy here than in the dry zone."}], "sim": {"type": "dots", "kind": "icon-array", "settings": {"population": 1000, "baseRate": 0.02, "sensitivity": 0.9, "falsePositiveRate": 0.05, "sliders": ["baseRate", "sensitivity", "falsePositiveRate"]}}, "realCase": {"kind": "failure", "title": "The Sally Clark case", "year": 1999, "text": "A mother was convicted of murdering her two infant sons, partly on an expert's claim that two cot deaths in one family had a '1 in 73 million' chance. That figure wrongly treated the deaths as independent, and the court ignored the base rate of the alternative, double murder, which is also extremely rare. The Royal Statistical Society protested, and her conviction was overturned in 2003.", "source": "Royal Statistical Society statement (2001); R v Clark [2003] EWCA Crim 1020"}, "misuse": "Plugging in made-up starting probabilities and then trusting the output because it came from a formula. Bayes is only as good as its base rate.", "related": ["M7", "M4", "M13"], "sources": ["Gerd Gigerenzer, Calculated Risks (2002)", "McDowell & Jacobs, Psychological Bulletin (2017): natural frequencies meta-analysis"], "videos": [{"title": "Bayes theorem, the geometry of changing beliefs", "channel": "3Blue1Brown", "url": null, "verified": false}, {"title": "The Bayesian Trap", "channel": "Veritasium", "url": null, "verified": false}], "quiz": {"predict": {"prompt": "Blight in 2% of plants. The test catches 90%, false-alarms 5%. A plant tests positive. Chance it's infected?", "options": ["about 90%", "about 50%", "about 27%", "about 5%"], "answer": 2, "why": "18 true positives vs 49 false positives out of 1,000: 18/67 ≈ 27%."}, "mcq": [{"prompt": "What happens to the answer if blight becomes common (20%)?", "options": ["It stays 27%", "It rises a lot", "It falls", "It becomes 90% exactly"], "answer": 1, "why": "A higher base rate means a larger share of positives are real (about 82%)."}], "whichModel": {"prompt": "A doctor says: 'This screening test is 95% accurate, but the disease is so rare that most positives are false alarms.'", "options": ["Bayesian updating", "Regression to the mean", "Selection effects", "Signal vs. noise"], "answer": 0, "why": "Base rate combined with test accuracy."}}, "evidenceLabel": "✅ proven (math/logic)"}, {"id": "M20", "name": "Trade-offs and opportunity cost", "aliases": ["No free lunch", "Opportunity cost"], "originator": "Friedrich von Wieser (term 'opportunity cost', 1914); Frédéric Bastiat", "year": "1914", "evidence": "proven", "category": "Recurring patterns", "rule": "Every choice costs the best alternative you gave up, and no solution maximises everything at once.", "plain": "Saying yes to one thing is saying no to something else. Name what you're giving up.", "formula": "Opportunity cost = value of the best forgone alternative", "story": {"act": 4, "trail": 20, "location": "power", "cast": ["ada", "rook", "mira", "you"], "beat": "The final decision. Power is finite. Full lamps for the greenhouse means half-speed mining, which means less ice, less water and slower hull repairs. Everyone wants everything maximised. You draw the power budget as one bar split into colours: every watt moved is a watt taken. The council picks a plan knowing exactly what it gave up, and writes that down."}, "examples": [{"location": "clinic", "text": "An hour Dox spends on paperwork is an hour not spent with patients."}, {"location": "habitat", "text": "Bigger living quarters mean more air to heat and scrub. Comfort costs oxygen."}, {"location": "market", "text": "Credits spent on luxury rations can't fund the backup pump."}], "sim": {"type": "flow", "kind": "budget-split", "settings": {"totalKW": 1000, "uses": ["greenhouse lamps", "mining", "life support", "habitat"], "outputs": ["O2", "water", "safety margin", "comfort"]}}, "realCase": {"kind": "failure", "title": "The Space Shuttle: one vehicle for every mission", "year": "1972–2011", "text": "The Shuttle was designed to be reusable, carry heavy cargo, meet military cross-range requirements and fly crew, all in one vehicle. The combined requirements drove up cost and complexity. It flew far less often and cost far more per launch than planned, and two orbiters were lost.", "source": "Columbia Accident Investigation Board Report, Vol. 1, ch. 1 (2003); Roger Launius, NASA history publications"}, "misuse": "Assuming every choice is zero-sum. Sometimes a better design or new technology improves several goals at once, so check for real innovation before accepting the trade-off.", "related": ["M16", "M19", "M1"], "sources": ["Thomas Sowell, Basic Economics (2000)", "N. Gregory Mankiw, Principles of Economics, ch. 1 (Ten Principles)"], "quiz": {"predict": {"prompt": "The greenhouse lamps get 100 kW more. What must happen?", "options": ["Nothing else changes", "Another use loses 100 kW, e.g. mining slows and less water comes in", "The power plant makes more automatically", "Oxygen falls"], "answer": 1, "why": "A fixed budget means every gain is a loss somewhere else."}, "mcq": [{"prompt": "The opportunity cost of studying for 2 hours is…", "options": ["zero", "the best thing you'd otherwise have done with those hours", "the textbook price", "your tuition"], "answer": 1, "why": "It's the best forgone alternative."}], "whichModel": {"prompt": "A company can fund one of two projects. Choosing A means forgoing B's expected profit.", "options": ["Trade-offs and opportunity cost", "Sunk cost", "Incentives", "Bottlenecks"], "answer": 0, "why": "The forgone B is the real cost of A."}}, "videos": [], "evidenceLabel": "✅ proven (math/logic)"}, {"id": "M3", "name": "Conjecture and refutation", "aliases": ["Falsification", "Hypothesis testing"], "originator": "Karl Popper", "year": "1934 / 1963", "evidence": "method", "category": "Thinking moves", "rule": "Guess, work out what else must follow if the guess is true, then test that consequence and try hard to prove yourself wrong.", "plain": "Don't look for evidence that you're right. Look for the test that would embarrass your idea, and run it.", "story": {"act": 2, "trail": 4, "location": "greenhouse", "cast": ["mira", "ada", "you"], "beat": "Mira is sure the lamps are dimming. You ask: 'If that's true, what else must be true?' The light meters should show lower output. They don't; brightness is normal. But the colour spectrum has drifted. The first guess dies and a better one is born."}, "examples": [{"location": "clinic", "text": "Dox suspects a contaminated water filter. If that's true, every household on that filter should show symptoms. Only some do, so the idea needs revising."}, {"location": "power", "text": "Ada believes a cable is overheating. She predicts one exact spot will be hot, points a thermal camera at it, and it is. A risky prediction survived."}, {"location": "council", "text": "A councillor claims the curfew reduced accidents. Asking 'what else would we see?' shows accidents also fell in areas without the curfew."}], "sim": {"type": "diagram", "kind": "hypothesis-branches", "settings": {"hypotheses": ["Lamps dimming", "Nutrient imbalance", "Blight", "Spectrum drift"], "tests": true}}, "realCase": {"kind": "failure", "title": "N-rays", "year": 1903, "text": "French physicist René Blondlot reported a new kind of radiation, and dozens of scientists confirmed seeing it. In 1904 Robert Wood visited the lab and secretly removed the essential prism. Blondlot still 'saw' the rays. The experimenters had looked for confirmation, never for refutation.", "source": "R. W. Wood, 'The n-Rays', Nature 70 (1904)"}, "misuse": "Throwing out a good theory at the first anomaly. Measurements can be wrong too, so check the test before killing the idea.", "related": ["M12", "M2", "M4", "M7"], "sources": ["Karl Popper, The Logic of Scientific Discovery (1934/1959)", "Karl Popper, Conjectures and Refutations (1963)"], "quiz": {"predict": {"prompt": "Mira is sure the lamps are the problem. What's the strongest test?", "options": ["Ask other botanists if they agree", "Find a measurement that would come out differently if she were wrong", "List all past lamp failures", "Replace the lamps and see"], "answer": 1, "why": "A test is only informative if it could fail."}, "mcq": [{"prompt": "Why did so many scientists 'see' N-rays?", "options": ["The rays were real but faint", "They expected to see them and never ran a test that could fail", "Their instruments were broken", "Fraud"], "answer": 1, "why": "Expectation plus no disconfirming test produced shared false confirmation."}], "whichModel": {"prompt": "An investor believes a company is great, so she writes down what would prove her wrong before buying and checks it every quarter.", "options": ["Conjecture and refutation", "Sunk cost", "Outside view", "Incentives"], "answer": 0, "why": "She commits to refutation conditions in advance."}}, "formula": null, "videos": [], "evidenceLabel": "🧭 method or rule of thumb"}, {"id": "M4", "name": "Causal thinking", "aliases": ["Correlation is not causation", "Confounding"], "originator": "Judea Pearl (formal causal inference); R. A. Fisher (randomised trials)", "year": "1935 / 2000", "evidence": "proven", "category": "Thinking moves", "rule": "Correlation isn't causation. Rule out chance, reverse causation and hidden common causes, then ask what would change if you intervened.", "plain": "Two things moving together doesn't mean one pushes the other. Ask what would happen if you changed one on purpose.", "formula": "P(Y | do(X)) ≠ P(Y | X)", "story": {"act": 2, "trail": 6, "location": "greenhouse", "cast": ["mira", "dox", "you"], "beat": "Mira notices that racks the crew visit most are the healthiest, and proposes more visits. You draw three arrows. Maybe visits cause health. Maybe healthy racks attract visits (they're the ones being harvested). Maybe racks near the door get both more visits and better air. Dox runs a real test: randomly chosen racks get extra visits. There's no difference. The door's air flow was the hidden cause."}, "examples": [{"location": "clinic", "text": "Colonists who take vitamin packs are healthier, but they also exercise more. A random trial is the only way to know if the pack does anything."}, {"location": "market", "text": "Stalls with more signs sell more. Do signs cause sales, or do rich stall owners buy both signs and stock?"}, {"location": "habitat", "text": "Homes with more fans have more heat complaints. The fans don't cause heat; hot homes buy fans. That's reverse causation."}], "sim": {"type": "diagram", "kind": "causal-graph", "settings": {"nodes": ["Crew visits", "Rack health", "Door airflow"], "edges": [["Door airflow", "Crew visits"], ["Door airflow", "Rack health"]], "toggleRandomise": true}}, "realCase": {"kind": "failure", "title": "Hormone replacement therapy and the heart", "year": 2002, "text": "Observational studies found women taking hormone therapy had fewer heart attacks, so it was widely prescribed for prevention. The randomised Women's Health Initiative trial found the estrogen-plus-progestin arm had more heart disease, not less. The women who chose hormones had been healthier and wealthier to begin with.", "source": "Writing Group for the WHI Investigators, JAMA 288 (2002)"}, "misuse": "Refusing to act until you have perfect causal proof. Sometimes a strong, consistent correlation plus a plausible mechanism is enough to act on, as with smoking and lung cancer.", "related": ["M2", "M3", "M7"], "sources": ["Judea Pearl & Dana Mackenzie, The Book of Why (2018)", "Austin Bradford Hill, 'The Environment and Disease' (1965)"], "quiz": {"predict": {"prompt": "Most-visited racks are healthiest. What's the best next step?", "options": ["Double visits everywhere", "Randomly assign extra visits to some racks and compare", "Stop visiting", "Ask the crew what they think"], "answer": 1, "why": "Randomising breaks hidden common causes."}, "mcq": [{"prompt": "Hot homes buying more fans is an example of…", "options": ["confounding", "reverse causation", "chance", "regression"], "answer": 1, "why": "The effect (heat) causes the 'cause' (fans)."}], "whichModel": {"prompt": "Cities with more firefighters have more fire damage, and a reporter concludes firefighters cause damage.", "options": ["Causal thinking", "Incentives", "Fat tails", "Selection effects"], "answer": 0, "why": "A common cause (big fires) drives both."}}, "videos": [], "evidenceLabel": "✅ proven (math/logic)"}, {"id": "M5", "name": "Decompose and transform", "aliases": ["Pólya's How to Solve It", "Divide and conquer"], "originator": "George Pólya", "year": "1945", "evidence": "method", "category": "Thinking moves", "rule": "Restate the problem, solve a smaller or special case, work backwards from the goal, or reuse a solved problem that has the same unknown.", "plain": "If a problem is too big, cut it into parts or change its shape until it looks like one you've solved before.", "story": {"act": 1, "trail": 3, "location": "lifesupport", "cast": ["ada", "you", "mira"], "beat": "'The oxygen problem' is too big to attack. You split it into production (greenhouse), storage (tanks), consumption (people) and leaks (the hull). Leak checks come back normal and consumption is steady, so the problem shrinks to one location: the Greenhouse Dome. Then you solve a smaller case, one crop rack, before tackling all 400."}, "examples": [{"location": "power", "text": "A blackout traced to 'the grid' becomes easy once it's split into generation, transmission and load. It's a single tripped breaker."}, {"location": "clinic", "text": "Dox works backwards from the goal: 'What would have to be true for this patient to recover?' That points to the one missing test."}, {"location": "docks", "text": "Scheduling 30 cargo drones is hard. Scheduling 3 is easy, and the pattern from 3 scales up."}], "sim": {"type": "diagram", "kind": "decomposition-tree", "settings": {"root": "Oxygen falling", "branches": ["Production", "Storage", "Consumption", "Leaks"], "eliminate": ["Storage", "Consumption", "Leaks"]}}, "realCase": {"kind": "success", "title": "Apollo 13's square filter in a round hole", "year": 1970, "text": "Carbon dioxide was building up in the lunar module, and the command module's square scrubber canisters didn't fit its round sockets. Ground engineers restated the problem as 'connect this shape to that one using only what's on board', built an adapter from plastic bags, cardboard and tape, and talked the crew through making it.", "source": "NASA, Apollo 13 Review Board report (1970)"}, "misuse": "Splitting a problem whose parts interact strongly. Optimising each piece separately can break the whole (see feedback loops, M14).", "related": ["M1", "M13", "M9", "M14"], "sources": ["George Pólya, How to Solve It (1945)"], "quiz": {"predict": {"prompt": "Oxygen is falling. Which first move narrows the problem fastest?", "options": ["Replace all the plants", "Check each part (production, storage, consumption, leaks) and rule parts out", "Ask Earth", "Reduce everyone's activity"], "answer": 1, "why": "Ruling parts out shrinks the search space. Guessing at the whole doesn't."}, "mcq": [{"prompt": "Which is NOT one of Pólya's moves?", "options": ["Solve a special case", "Work backwards", "Find a related solved problem", "Pick the answer that feels right"], "answer": 3, "why": "Pólya's heuristics are deliberate transformations, not gut picks."}], "whichModel": {"prompt": "A programmer can't find a bug, so she deletes half the code path and checks whether the bug remains, and repeats.", "options": ["Decompose and transform", "Inversion", "Signal vs. noise", "First principles"], "answer": 0, "why": "Bisection is decomposition: shrink the problem until the cause is isolated."}}, "formula": null, "videos": [], "evidenceLabel": "🧭 method or rule of thumb"}, {"id": "M6", "name": "Same structure, same solution", "aliases": ["Isomorphism", "Analogy by mathematics", "Universality"], "originator": "Many; e.g. Kermack & McKendrick (epidemic equations, 1927)", "year": "—", "evidence": "proven", "category": "Thinking moves", "rule": "Sys /* ---------- plotting helpers (screen space) ---------- */
function txt(s, x, y, o = {}){
  ctx.font = `${o.w || 400} ${o.size || 11}px ${getFont(o.f || 'mono')}`;
  ctx.fillStyle = o.c || T.muted; ctx.textAlign = o.a || 'left'; ctx.textBaseline = o.b || 'alphabetic';
  ctx.fillText(s, x, y); ctx.textBaseline = 'alphabetic';
}
function plot(r, o){
  const L = r.x + (o.padL ?? 40), Rr = r.x + r.w - 10, Tp = r.y + 10, B = r.y + r.h - (o.padB ?? 26);
  const lx = v => o.xlog ? Math.log10(v) : v, ly = v => o.ylog ? Math.log10(v) : v;
  const X = v => L + (lx(v) - lx(o.xmin)) / (lx(o.xmax) - lx(o.xmin)) * (Rr - L);
  const Y = v => B - (ly(Math.min(o.ymax, Math.max(o.ymin, v))) - ly(o.ymin)) / (ly(o.ymax) - ly(o.ymin)) * (B - Tp);
  ctx.lineWidth = 1;
  for (const v of o.yt || []){ ctx.strokeStyle = rgba(T.muted, .15); ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(Rr, Y(v)); ctx.stroke();
    txt(o.yf ? o.yf(v) : v, L - 6, Y(v), {a:'right', b:'middle', size:10}); }
  for (const v of o.xt || []) txt(o.xf ? o.xf(v) : v, X(v), B + 14, {a:'center', size:10});
  ctx.strokeStyle = rgba(T.muted, .6); ctx.beginPath(); ctx.moveTo(L, Tp); ctx.lineTo(L, B); ctx.lineTo(Rr, B); ctx.stroke();
  if (o.xl) txt(o.xl, Rr, B + 24, {a:'right', size:10});
  if (o.yl) txt(o.yl, L + 4, Tp + 8, {size:10});
  return {X, Y, L, R:Rr, T:Tp, B};
}
function polyline(pts, col, w = 2, dash){
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.setLineDash(dash || []); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); ctx.setLineDash([]);
}
function split(r, frac, gap = 14){
  if (r.w > 560) { const a = r.w * frac; return [{x:r.x, y:r.y, w:a - gap/2, h:r.h}, {x:r.x + a + gap/2, y:r.y, w:r.w - a - gap/2, h:r.h}]; }
  const a = r.h * frac; return [{x:r.x, y:r.y, w:r.w, h:a - gap/2}, {x:r.x, y:r.y + a + gap/2, w:r.w, h:r.h - a - gap/2}];
}
function legend(items, x, y, size = 11){
  let yy = y;
  for (const [col, label, hollow] of items){
    ctx.beginPath(); ctx.arc(x + 5, yy - 4, 4.5, 0, Math.PI*2);
    if (hollow){ ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke(); } else { ctx.fillStyle = col; ctx.fill(); }
    txt(label, x + 16, yy, {size, c:T.ink}); yy += size + 8;
  }
  return yy;
}

  gen(n, r){ const p = Array.from({length:n}, () => [r(), r()]); const mx = p.reduce((a, q) => a + q[0], 0)/n, my = p.reduce((a, q) => a + q[1], 0)/n;

  controls: s => [
