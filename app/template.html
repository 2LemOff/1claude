<title>Kepler Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#E8EDF1; --panel:#F7F9FB; --ink:#14202B; --muted:#586878; --line:#C7D1DA;
  --accent:#0B8A83; --accent-ink:#FFFFFF; --warn:#C8621E;
  --sky1:#D5E0E9; --sky2:#EEF3F6; --ground:#B7C3CD; --ground2:#A3B1BC; --module:#FFFFFF;
  --glass:rgba(11,138,131,0.07); --holo:rgba(247,249,251,0.95); --stars:0;
  --c-you:#FFFFFF; --c-ada:#0F9A8E; --c-mira:#4C9A2A; --c-dox:#2F6FD6; --c-rook:#D0453A;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-story:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0F15; --panel:#101821; --ink:#E2EAF0; --muted:#8696A6; --line:#233140;
    --accent:#3ED3C2; --accent-ink:#04211E; --warn:#F0914A;
    --sky1:#04070B; --sky2:#0C131B; --ground:#18232E; --ground2:#121B24; --module:#152029;
    --glass:rgba(62,211,194,0.06); --holo:rgba(11,17,24,0.95); --stars:0.85;
    --c-you:#F4F7FA; --c-ada:#3ED3C2; --c-mira:#86D05F; --c-dox:#76A7FF; --c-rook:#FF6E61;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F15; --panel:#101821; --ink:#E2EAF0; --muted:#8696A6; --line:#233140;
  --accent:#3ED3C2; --accent-ink:#04211E; --warn:#F0914A;
  --sky1:#04070B; --sky2:#0C131B; --ground:#18232E; --ground2:#121B24; --module:#152029;
  --glass:rgba(62,211,194,0.06); --holo:rgba(11,17,24,0.95); --stars:0.85;
  --c-you:#F4F7FA; --c-ada:#3ED3C2; --c-mira:#86D05F; --c-dox:#76A7FF; --c-rook:#FF6E61;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:14px 32px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}

/* header strip: the colony's status readout */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink);font-weight:500}
.status .bad b{color:var(--warn)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toggle input{accent-color:var(--accent)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:10px}
@media (max-width:960px){.stage{position:static}}
.canvasbox{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sky2)}
canvas#scene{display:block;width:100%;touch-action:manipulation}
.scenebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.simcontrols{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.simcontrols[hidden]{display:none!important}
.ctl{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ctl input[type=range]{width:130px;accent-color:var(--accent)}
.ctl output{color:var(--ink);min-width:4.5ch;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* trail */
.trail{display:flex;flex-direction:column;gap:8px}
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.act h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font-size:13px}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{border-color:var(--accent)}
.chip[aria-current="true"] i{background:var(--accent);color:var(--accent-ink)}
.chip .t{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase}

/* lesson panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.02;margin:0;text-wrap:balance}
.rule{font-size:16px;font-weight:500;margin:0}
.formula{font-family:var(--f-mono);font-size:13px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--bg);overflow-x:auto;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.beat{font-family:var(--f-story);font-size:17px;line-height:1.55;margin:0;max-width:62ch}
.beat .s{opacity:.38;transition:opacity .25s}
.beat .s.on{opacity:1}
.beat .s.done{opacity:.72}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plain{font-family:var(--f-story);font-style:italic;color:var(--muted);margin:0}
ul.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.ex button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;line-height:1.45}
ul.ex button:hover,ul.ex button[aria-pressed="true"]{border-color:var(--accent)}
ul.ex button:focus-visible{outline:2px solid var(--accent)}
ul.ex .loc{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--accent);padding-top:3px;width:9ch}
.archive{border:1px dashed var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.archive .hd{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.archive .hd b{color:var(--warn);font-weight:500}
.archive .hd b.ok{color:var(--accent)}
.archive h5{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.archive p{margin:0;font-family:var(--f-story);font-size:15px}
.archive cite{font-size:12px;color:var(--muted);font-style:normal}
.misuse{margin:0;font-size:14px;padding:10px 12px;border-left:2px solid var(--warn);background:var(--bg)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:13px;color:var(--muted);margin:0}
ul.src{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
ul.src a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.beat .s{transition:none}}
@media (max-width:960px){
  .act{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .act h3{width:auto;flex:0 0 auto}
  .act h3 .q{display:none}
  .chip{flex:0 0 auto;white-space:nowrap}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Kepler Station</h1><span>mental models · 20-model pilot</span></div>
    <div class="status" aria-label="Colony status">
      <span>crew <b>200</b></span>
      <span>O₂ reserve <b>6.0 t</b></span>
      <span class="bad">shortfall <b>≈50 kg/day</b></span>
      <span>supply ship <b>T−90 days</b></span>
      <label class="toggle"><input type="checkbox" id="fx"> formulas</label>
    </div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Colony scene">
      <div class="canvasbox"><canvas id="scene" aria-label="Kepler Station colony with five shape characters"></canvas></div>
      <div class="scenebar">
        <span id="where">Tap a building or a numbered stop below.</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="simBtn" type="button">Open station screen</button>
          <button class="btn" id="overview" type="button">Whole colony</button>
        </span>
      </div>
      <div class="simcontrols" id="simControls" hidden></div>
      <nav class="trail" id="trail" aria-label="Suggested trail"></nav>
    </section>

    <article class="panel" id="panel" aria-live="polite"></article>
  </div>
</div>

<script>
const C = /*__CONTENT__*/null;
const MODELS = Object.fromEntries(C.models.map(m => [m.id, m]));
const TRAIL = C.index.trail;
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem('ks.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ks.' + k, JSON.stringify(v)); } catch(e){} }
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- colony layout (world units: 1000 × 640) ---------- */
const LOC = {
  docks:      {x:95,  y:478, w:110, h:56,  label:'DOCKS'},
  greenhouse: {x:320, y:440, w:230, h:150, label:'GREENHOUSE DOME'},
  lifesupport:{x:548, y:480, w:130, h:74,  label:'LIFE SUPPORT'},
  power:      {x:760, y:474, w:150, h:86,  label:'POWER PLANT'},
  clinic:     {x:470, y:330, w:116, h:60,  label:'CLINIC'},
  market:     {x:640, y:340, w:130, h:60,  label:'MARKET'},
  habitat:    {x:500, y:210, w:290, h:52,  label:'HABITAT RING'},
  council:    {x:770, y:262, w:112, h:56,  label:'COUNCIL HALL'},
  comms:      {x:905, y:210, w:44,  h:150, label:'COMMS'},
  mine:       {x:560, y:598, w:230, h:44,  label:'MINE'}
};
const HOME = {you:'habitat', ada:'power', mira:'greenhouse', dox:'clinic', rook:'mine'};
const NAMES = {ada:'Ada', mira:'Mira', dox:'Dox', rook:'Rook', you:'You'};

/* ---------- theme tokens for the canvas ---------- */
let T = {};
function readTokens(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  T = {bg:g('--bg'), panel:g('--panel'), ink:g('--ink'), muted:g('--muted'), line:g('--line'), accent:g('--accent'),
       warn:g('--warn'), sky1:g('--sky1'), sky2:g('--sky2'), ground:g('--ground'), ground2:g('--ground2'), module:g('--module'),
       glass:g('--glass'), holo:g('--holo'), stars:parseFloat(g('--stars')) || 0,
       cast:{you:g('--c-you'), ada:g('--c-ada'), mira:g('--c-mira'), dox:g('--c-dox'), rook:g('--c-rook')}};
}
readTokens();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
function rgba(hex, a){
  if (!hex || hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ---------- random ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R0 = rng(7);
const gauss = r => { let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };

/* ---------- canvas & camera ---------- */
const cv = $('#scene'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, S = 1, OX = 0, OY = 0;
const cam = {x:500, y:340, z:1, tx:500, ty:340, tz:1};
function resize(){
  const w = cv.parentElement.clientWidth;
  VW = w; VH = Math.round(w < 620 ? Math.min(w * 1.02, 560) : w * 0.64);
  DPR = window.devicePixelRatio || 1;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); cv.style.height = VH + 'px';
  S = Math.min(VW / 1000, VH / 640);
}
new ResizeObserver(resize).observe(cv.parentElement);
resize();
const toScreen = (x, y) => [ (x - cam.x) * S * cam.z + VW/2, (y - cam.y) * S * cam.z + VH/2 ];
const toWorld  = (sx, sy) => [ (sx - VW/2) / (S * cam.z) + cam.x, (sy - VH/2) / (S * cam.z) + cam.y ];
function focus(loc, z){
  const L = LOC[loc]; if (!L) return;
  cam.tx = L.x; cam.ty = L.y - 20; cam.tz = z || 1.5;
}
function overview(){ cam.tx = 500; cam.ty = 360; cam.tz = VW < 620 ? 1.05 : 1; }

/* ---------- stars (fixed) ---------- */
const STARS = Array.from({length:140}, () => [R0()*1400 - 200, R0()*700 - 80, R0()*1.3 + .3, R0()]);

/* ---------- cast: Heider–Simmel shapes ---------- */
const cast = Object.keys(HOME).map((id, i) => {
  const L = LOC[HOME[id]];
  return {id, x:L.x + (i-2)*16, y:L.y + L.h/2 - 16, vx:0, vy:0, tx:L.x, ty:L.y + L.h/2 - 16, rot:0,
          pulse:0, hop:0, shake:0, wait:R0()*2, anchor:HOME[id], stage:false};
});
const who = id => cast.find(c => c.id === id);
function spotIn(loc, k, n){
  const L = LOC[loc];
  const floorY = loc === 'comms' ? L.y + L.h/2 - 14 : L.y + L.h/2 - 14;
  const span = Math.min(L.w - 30, 36 * n);
  const x = L.x - span/2 + (n <= 1 ? span/2 : span * k / (n - 1));
  return [x, floorY];
}
function sendTo(c, loc, k = 0, n = 1){ const [x, y] = spotIn(loc, k, n); c.anchor = loc; c.tx = x; c.ty = y; c.wait = 3 + Math.random()*3; }
function wanderTarget(c){
  const L = LOC[c.anchor];
  c.tx = L.x + (Math.random() - .5) * (L.w - 30);
  c.ty = L.y + L.h/2 - 14 - Math.random() * Math.min(20, L.h * .3);
}
function stepCast(dt){
  for (const c of cast){
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    const maxS = reduceMotion ? 900 : 190;
    const sp = Math.min(maxS, d * 2.4);
    const dvx = d > .5 ? dx / d * sp : 0, dvy = d > .5 ? dy / d * sp : 0;
    const k = Math.min(1, dt * 5);
    c.vx += (dvx - c.vx) * k; c.vy += (dvy - c.vy) * k;
    c.x += c.vx * dt; c.y += c.vy * dt;
    const v = Math.hypot(c.vx, c.vy);
    if (v > 8) c.rot = Math.atan2(c.vy, c.vx);
    c.pulse = Math.max(0, c.pulse - dt); c.hop = Math.max(0, c.hop - dt); c.shake = Math.max(0, c.shake - dt);
    if (!c.stage && d < 4 && !reduceMotion){ c.wait -= dt; if (c.wait <= 0){ wanderTarget(c); c.wait = 2 + Math.random()*4; } }
  }
}
function shapePath(kind, r){
  ctx.beginPath();
  if (kind === 'circle') ctx.arc(0, 0, r, 0, Math.PI*2);
  else if (kind === 'triangle'){ ctx.moveTo(r*1.25, 0); ctx.lineTo(-r*.8, r*.9); ctx.lineTo(-r*.8, -r*.9); ctx.closePath(); }
  else if (kind === 'square') ctx.rect(-r*.85, -r*.85, r*1.7, r*1.7);
  else if (kind === 'diamond'){ ctx.moveTo(r*1.15, 0); ctx.lineTo(0, r*.95); ctx.lineTo(-r*1.15, 0); ctx.lineTo(0, -r*.95); ctx.closePath(); }
  else if (kind === 'hexagon'){ for (let i = 0; i < 6; i++){ const a = i * Math.PI/3; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a)*r, Math.sin(a)*r); } ctx.closePath(); }
}
const SHAPE = Object.fromEntries(C.story.cast.map(c => [c.id, c.shape]));
function drawCast(t){
  const r = 11 * S * cam.z;
  for (const c of cast){
    let [sx, sy] = toScreen(c.x, c.y);
    if (c.hop > 0) sy -= Math.sin(c.hop / .5 * Math.PI) * r * 1.2;
    if (c.shake > 0) sx += Math.sin(t * 60) * r * .25;
    ctx.save(); ctx.translate(sx, sy);
    if (c.pulse > 0){
      const p = 1 - c.pulse / 1.2;
      ctx.beginPath(); ctx.arc(0, 0, r * (1.4 + p * 1.6), 0, Math.PI*2);
      ctx.strokeStyle = rgba(T.cast[c.id], (1 - p) * .8); ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.rotate(SHAPE[c.id] === 'triangle' || SHAPE[c.id] === 'diamond' ? c.rot : 0);
    shapePath(SHAPE[c.id], r);
    ctx.fillStyle = T.cast[c.id]; ctx.fill();
    ctx.lineWidth = Math.max(1, r * .12); ctx.strokeStyle = rgba(T.ink, c.id === 'you' ? .85 : .35); ctx.stroke();
    ctx.restore();
    ctx.font = `500 ${Math.max(9, 9.5 * S * cam.z)}px ${getFont('mono')}`;
    ctx.fillStyle = rgba(T.ink, c.pulse > 0 ? 1 : .6); ctx.textAlign = 'center';
    ctx.fillText(NAMES[c.id], sx, sy + r + 12 * Math.max(.9, S * cam.z));
  }
}
const FONTS = {mono:'"JetBrains Mono",ui-monospace,monospace', disp:'"Barlow Condensed","Arial Narrow",sans-serif', ui:'Barlow,system-ui,sans-serif'};
const getFont = k => FONTS[k];

/* ---------- colony drawing ---------- */
let activeLoc = null, hoverLoc = null, blight = 0;
function drawColony(t){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, T.sky1); g.addColorStop(1, T.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  if (T.stars > 0){
    for (const [x, y, s, ph] of STARS){
      const [sx, sy] = toScreen(x, y);
      ctx.fillStyle = `rgba(226,234,240,${T.stars * (.35 + .35 * Math.sin(t * .8 + ph * 9))})`;
      ctx.fillRect(sx, sy, s, s);
    }
  }
  // ground
  const [, gy] = toScreen(0, 520);
  ctx.fillStyle = T.ground; ctx.fillRect(0, gy, VW, VH - gy);
  const [, gy2] = toScreen(0, 572);
  ctx.fillStyle = T.ground2; ctx.fillRect(0, gy2, VW, VH - gy2);
  // dome
  const [dcx, dcy] = toScreen(500, 520), rx = 455 * S * cam.z, ry = 420 * S * cam.z;
  ctx.beginPath(); ctx.ellipse(dcx, dcy, rx, ry, 0, Math.PI, 0);
  ctx.fillStyle = T.glass; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = rgba(T.accent, .45); ctx.stroke();
  for (let i = 1; i < 6; i++){ // dome ribs
    ctx.beginPath(); ctx.ellipse(dcx, dcy, rx * i / 6, ry, 0, Math.PI, 0);
    ctx.strokeStyle = rgba(T.accent, .08); ctx.lineWidth = 1; ctx.stroke();
  }
  // mine shaft
  line(560, 520, 560, 578, T.line, 3);
  // modules
  for (const [id, L] of Object.entries(LOC)) drawModule(id, L, t);
  // blight tint on racks
}
function line(x1, y1, x2, y2, col, w){
  const [a, b] = toScreen(x1, y1), [c, d] = toScreen(x2, y2);
  ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.strokeStyle = col; ctx.lineWidth = w * S * cam.z; ctx.stroke();
}

function txt(s, x, y, o = {}){
  ctx.font = `${o.w || 400} ${o.size || 11}px ${getFont(o.f || 'mono')}`;
  ctx.fillStyle = o.c || T.muted; ctx.textAlign = o.a || 'left'; ctx.textBaseline = o.b || 'alphabetic';

function plot(r, o){
  const L = r.x + (o.padL ?? 40), Rr = r.x + r.w - 10, Tp = r.y + 10, B = r.y + r.h - (o.padB ?? 26);
  const lx = v => o.xlog ? Math.log10(v) : v, ly = v => o.ylog ? Math.log10(v) : v;
  const X = v => L + (lx(v) - lx(o.xmin)) / (lx(o.xmax) - lx(o.xmin)) * (Rr - L);
  const Y = v => B - (ly(Math.min(o.ymax, Math.max(o.ymin, v))) - ly(o.ymin)) / (ly(o.ymax) - ly(o.ymin)) * (B - Tp);
  ctx.lineWidth = 1;
  for (const v of o.yt || []){ ctx.strokeStyle = rgba(T.muted, .15); ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(Rr, Y(v)); ctx.stroke();
    txt(o.yf ? o.yf(v) : v, L - 6, Y(v), {a:'right', b:'middle', size:10}); }
  for (const v of o.xt || []) txt(o.xf ? o.xf(v) : v, X(v), B + 14, {a:'center', size:10});
  ctx.strokeStyle = rgba(T.muted, .6); ctx.beginPath(); ctx.moveTo(L, Tp); ctx.lineTo(L, B); ctx.lineTo(Rr, B); ctx.stroke();
  if (o.xl) txt(o.xl, Rr, B + 24, {a:'right', size:10});
  if (o.yl) txt(o.yl, L + 4, Tp + 8, {size:10});
  return {X, Y, L, R:Rr, T:Tp, B};
}
function polyline(pts, col, w = 2, dash){

}
function split(r, frac, gap = 14){
  if (r.w > 560) { const a = r.w * frac; return [{x:r.x, y:r.y, w:a - gap/2, h:r.h}, {x:r.x + a + gap/2, y:r.y, w:r.w - a - gap/2, h:r.h}]; }

}

    const [a, b] = split(r, .62);
    const p = plot(a, {xmin:0, xmax:days, ymin:0, ymax:K, xt:[0, 10, 20, 30], yt:[0, 100, 200, 300, 400], xl:'day', yl:'racks with blight', padL:38});
    const series = (f, col, dash) => { const pts = []; for (let t = 0; t <= day; t += .25) pts.push([p.X(t), p.Y(f(t))]); polyline(pts, col, 2.2, dash); };
    if (st.lin) series(lin, T.muted, [5, 4]);
    if (st.exp) series(ex, rgba(T.warn, .55), [2, 3]);
    if (st.log) series(lg, T.warn);
    ctx.strokeStyle = rgba(T.ink, .4); ctx.beginPath(); ctx.moveTo(p.X(day), p.T); ctx.lineTo(p.X(day), p.B); ctx.stroke();
    const n = Math.round(lg(day));
    const cols = 20, cell = Math.min(b.w / cols, (b.h - 70) / 20), ox = b.x;
    for (let i = 0; i < K; i++){ ctx.fillStyle = i < n ? T.warn : rgba(T.cast.mira, .55); ctx.fillRect(ox + (i % cols) * cell, b.y + 56 + Math.floor(i / cols) * cell, cell * .78, cell * .78); }
    txt(`DAY ${Math.floor(day)}`, b.x, b.y + 14, {size:11});
    txt(`${n} of 400 racks`, b.x, b.y + 36, {size:20, f:'disp', w:700, c:T.ink});
    txt(`your gut says ${Math.round(Math.min(K, lin(day)))}`, b.x, b.y + 50, {size:11});
  }
};

SIMS['stock-and-flow'] = {
  title: 'CO₂ injection with a delayed sensor',
  controls: s => [
    {id:'sensorDelayHours', label:'sensor delay', min:0, max:12, step:1, value:s.sensorDelayHours, fmt:v => v + ' h'},
    {id:'gain', label:'reaction strength', min:.05, max:1, step:.05, value:.4, fmt:v => v.toFixed(2)}
  ],
  buttons: [{label:'Replay', fn:st => st.t = 0}],
  init(s){ const st = {delay:s.sensorDelayHours, gain:.4, target:s.target, t:0}; this.run(st); return st; },
  param(st, id, v){ if (id === 'sensorDelayHours') st.delay = v; else st.gain = v; this.run(st); st.t = 0; },
  run(st){
    const dt = .1, steps = 960, L = [600], U = [], Sd = [];
    for (let i = 0; i < steps; i++){
      const lag = Math.round(st.delay / dt), sensed = L[Math.max(0, i - lag)];
      const u = Math.max(0, Math.min(500, 100 + st.gain * (st.target - sensed)));
      U.push(u); Sd.push(sensed);
      L.push(L[i] + (u - .1 * L[i]) * dt);
    }
    st.L = L; st.U = U; st.S = Sd;
  },
  draw(st, r, dt){
    st.t += dt; const i = reduceMotion ? 959 : Math.min(959, Math.floor(st.t * 120));
    const [a, b] = split(r, .34);
    // tank schematic
    const tw = Math.min(a.w * .45, 110), th = Math.min(a.h * .62, 190), tx = a.x + (a.w - tw) / 2, ty = a.y + 40;
    const lvl = Math.min(1, st.L[i] / 1600);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5; ctx.strokeRect(tx, ty, tw, th);
    ctx.fillStyle = rgba(T.accent, .35); ctx.fillRect(tx + 1, ty + th * (1 - lvl), tw - 2, th * lvl - 1);
    const tgY = ty + th * (1 - st.target / 1600);
    ctx.setLineDash([4, 3]); ctx.strokeStyle = T.ink; ctx.beginPath(); ctx.moveTo(tx - 8, tgY); ctx.lineTo(tx + tw + 8, tgY); ctx.stroke(); ctx.setLineDash([]);
    txt('target', tx + tw + 10, tgY + 4, {size:10});
    const inW = 2 + st.U[i] / 40, outW = 2 + .1 * st.L[i] / 40;
    ctx.lineWidth = inW; ctx.strokeStyle = T.warn; ctx.beginPath(); ctx.moveTo(tx + tw/2, a.y + 6); ctx.lineTo(tx + tw/2, ty - 2); ctx.stroke();
    txt(`injection ${Math.round(st.U[i])}/h`, tx + tw/2 + 10, a.y + 20, {size:10, c:T.warn});
    ctx.lineWidth = outW; ctx.strokeStyle = T.cast.mira; ctx.beginPath(); ctx.moveTo(tx + tw, ty + th - 10); ctx.lineTo(tx + tw + 30, ty + th - 10); ctx.stroke();
    txt('plants absorb', tx + tw/2, ty + th + 16, {size:10, a:'center', c:T.cast.mira});
    txt(`reads ${Math.round(st.S[i])} ppm · actual ${Math.round(st.L[i])}`, a.x + a.w/2, ty + th + 32, {size:10, a:'center', c:T.ink});
    // chart
    const p = plot(b, {xmin:0, xmax:96, ymin:0, ymax:1800, xt:[0, 24, 48, 72, 96], yt:[0, 500, 1000, 1500], xl:'hours', yl:'CO₂ (ppm)', padL:44});
    polyline([[p.X(0), p.Y(st.target)], [p.X(96), p.Y(st.target)]], rgba(T.ink, .5), 1, [4, 3]);
    const pts = [], sp = [];
    for (let k = 0; k <= i; k += 2){ pts.push([p.X(k * .1), p.Y(st.L[k])]); sp.push([p.X(k * .1), p.Y(st.S[k])]); }
    polyline(sp, rgba(T.muted, .7), 1.2, [2, 3]);
    polyline(pts, T.accent, 2.2);
    legend([[T.accent, 'actual CO₂'], [T.muted, 'what the sensor shows'], [T.ink, 'target (dashed)', true]], p.R - 150, p.T + 12, 10);
  }
};

function splitSentences(t){ return t.match(/[^.!?]+[.!?]+['"’”]?\s*/g) || [t]; }
function speakerOf(s){
  const m = s.match(/\b(Ada|Mira|Dox|Rook)\b/); const y = /^\s*(You|'You|“You)\b/.test(s);
  if (y) return 'you'; return m ? m[1].toLowerCase() : null;
}
function openModel(id, fromTrail){
  const m = MODELS[id]; cur = m; beatIdx = 0; store.set('last', id);
  closeSim();
  sentences = splitSentences(m.story.beat);
  activeLoc = m.story.location; focus(activeLoc, 1.55);
  blight = Math.min(1, (m.story.trail - 1) / 16);
  // stage the cast
  cast.forEach(c => { c.stage = false; });
  const inScene = m.story.cast;
  inScene.forEach((cid, k) => { const c = who(cid); c.stage = true; sendTo(c, activeLoc, k, inScene.length); });
  cast.filter(c => !inScene.includes(c.id)).forEach(c => { c.stage = false; sendTo(c, HOME[c.id]); });
  renderPanel(m);
  renderTrail();
  playSentence();
  $('#where').textContent = `${LOC[activeLoc].label.toLowerCase()} · stop ${m.story.trail} of 20`;
  $('#simBtn').disabled = !simAvailable(m);
  $('#simBtn').title = simAvailable(m) ? '' : (m.sim.type === 'agents' ? 'Agent-world screen arrives in build step 5' : 'Diagram screen arrives in build step 3');

function playSentence(){
  const s = sentences[beatIdx] || '';
  const sp = speakerOf(s);
  cast.forEach(c => { if (c.stage){ const k = cur.story.cast.indexOf(c.id); const [x, y] = spotIn(activeLoc, k, cur.story.cast.length); c.tx = x; c.ty = y; } });
  if (sp && who(sp)){
    const c = who(sp); c.pulse = 1.2; c.hop = .5;
    if (!c.stage){ c.stage = true; sendTo(c, activeLoc, 0, 1); }
    if (/!|scoff|burn|panic/i.test(s)) c.shake = .6;
  }
  document.querySelectorAll('.beat .s').forEach((el, i) => { el.classList.toggle('on', i === beatIdx); el.classList.toggle('done', i < beatIdx); });
  const n = $('#beatN'); if (n) n.textContent = `${beatIdx + 1} / ${sentences.length}`;
  const prev = $('#bPrev'), next = $('#bNext');
  if (prev) prev.disabled = beatIdx === 0;
  if (next) next.textContent = beatIdx >= sentences.length - 1 ? 'Replay' : 'Next';
}

addEventListener('keydown', e => { if (e.key === 'Escape' && SIM) closeSim(); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const k = reduceMotion ? 1 : Math.min(1, dt * 3.5);
  cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; cam.z += (cam.tz - cam.z) * k;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stepCast(dt);
  drawColony(now / 1000);
  drawCast(now / 1000);
  if (SIM) drawHolo(dt);
  requestAnimationFrame(frame);
}
overview(); cam.x = cam.tx; cam.y = cam.ty; cam.z = cam.tz;
const start = store.get('last', TRAIL[0]);
openModel(MODELS[start] ? start : TRAIL[0]);
requestAnimationFrame(frame);
</script>
